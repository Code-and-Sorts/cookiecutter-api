# `yield` in file paths needs Copier 9.18.2+.
_min_copier_version: "9.18.2"

_jinja_extensions:
  - jinja2_strcase.StrcaseExtension
  - jinja2_time.TimeExtension

# Render every file as a template, without a .jinja suffix.
_templates_suffix: ""

_subdirectory: template

project_name:
  type: str
  default: "Cookiecutter API"
  # Copier only runs validators for prompted questions, so derived names are checked here.
  validator: >-
    {%- set project_lower_camel_name = project_name | to_lower_camel -%}
    {%- set project_class_name = project_name | to_camel -%}
    {%- set project_endpoint = project_name.lower().replace(' ', '-') -%}
    {%- if not (project_lower_camel_name | regex_search('^[a-z]+(?:[A-Z][a-z]+)*$')) -%}
    The project lower camel {{ project_lower_camel_name }} is not valid camel case. Please create a name using camelCase.
    {%- elif not (project_class_name | regex_search('^[A-Z][a-zA-Z0-9]*$')) -%}
    The project class name {{ project_class_name }} is not a valid class name. Please create a class name using PascalCase.
    {%- elif not (project_endpoint | regex_search('^[a-zA-Z0-9\-_]*$')) -%}
    The project endpoint {{ project_endpoint }} is not a valid REST endpoint name. Please do not use a space or _ and use - instead.
    {%- endif -%}

project_description:
  type: str
  default: "This is a template repository for API projects."

author:
  type: str
  default: "Code and Sorts (Colby Timm)"

cloud_service:
  type: str
  default: "Azure Function App"
  choices:
    - "Azure Function App"
    - "GCP Cloud Function"
    - "AWS Lambda"

open_source_license:
  type: str
  default: "MIT license"
  choices:
    - "MIT license"
    - "BSD license"
    - "ISC license"
    - "Apache Software License 2.0"
    - "GNU General Public License v3"
    - "Not open source"

project_lower_camel_name:
  type: str
  when: false
  default: "{{ project_name | to_lower_camel }}"

project_endpoint:
  type: str
  when: false
  default: "{{ project_name.lower().replace(' ', '-') }}"

project_class_name:
  type: str
  when: false
  default: "{{ project_name | to_camel }}"

health_endpoint:
  type: str
  default: "health"
  help: >-
    URL segment for the health check (kebab-case); leave empty to generate no
    health check.
  validator: >-
    {%- if health_endpoint and not (health_endpoint | regex_search('^[a-z0-9][a-z0-9\-]*$')) -%}
    Health endpoint '{{ health_endpoint }}' must be empty or a kebab-case URL segment.
    {%- endif -%}

resources:
  type: yaml
  multiline: true
  help: >-
    Resources to generate. Each item: name (PascalCase), endpoint (kebab-case URL
    segment), container (storage id; equal ids share storage), operations (subset of
    list, get_by_id, create, update, replace, delete). The health_endpoint segment and
    the names Health, BaseEntity, BaseError, NotFoundError and ValidationError are
    reserved.
  default: |
    - name: "{{ project_class_name }}"
      endpoint: "{{ project_endpoint }}"
      container: "{{ project_endpoint }}"
      operations: ["list", "get_by_id", "create", "update", "delete"]
  validator: >-
    {%- set valid_ops = ["list", "get_by_id", "create", "update", "replace", "delete"] -%}
    {%- set reserved_names = ["Health", "BaseEntity", "BaseError", "NotFoundError", "ValidationError"] -%}
    {%- set ns = namespace(err="", eps=[], names=[], lnames=[], containers=[], clash="") -%}
    {%- if resources | length < 1 -%}
    {%- set ns.err = "At least one resource is required." -%}
    {%- else -%}
    {%- for r in resources -%}
    {%- if not ns.err -%}
    {%- set ns.clash = "" -%}
    {%- for other in ns.containers if other != r.container | string and ((other | lower | replace('-', '_')) == (r.container | string | lower | replace('-', '_')) or (other | to_camel) == (r.container | string | to_camel)) -%}
    {%- set ns.clash = other -%}
    {%- endfor -%}
    {%- if not r.name or not (r.name | string | regex_search('^[A-Z][A-Za-z0-9]*$')) -%}
    {%- set ns.err = "Resource name '" ~ (r.name | default('')) ~ "' must be PascalCase." -%}
    {%- elif r.name in reserved_names -%}
    {%- set ns.err = "Resource name '" ~ r.name ~ "' is reserved. Reserved names: " ~ (reserved_names | join(', ')) ~ "." -%}
    {%- elif not r.endpoint or not (r.endpoint | string | regex_search('^[a-z0-9][a-z0-9\-]*$')) -%}
    {%- set ns.err = "Resource endpoint '" ~ (r.endpoint | default('')) ~ "' must be a kebab-case URL segment." -%}
    {%- elif health_endpoint and r.endpoint == health_endpoint -%}
    {%- set ns.err = "Resource endpoint '" ~ r.endpoint ~ "' is reserved for the health check." -%}
    {%- elif not r.container or not (r.container | string | regex_search('^[A-Za-z0-9_\-]+$')) -%}
    {%- set ns.err = "Resource container '" ~ (r.container | default('')) ~ "' has an invalid id." -%}
    {%- elif ns.clash -%}
    {%- set ns.err = "Containers '" ~ ns.clash ~ "' and '" ~ r.container ~ "' map to the same setting name. Use one id for shared storage or ids that differ beyond case, '-' and '_'." -%}
    {%- elif (r.operations | default([]) | length) < 1 -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' must enable at least one operation." -%}
    {%- elif r.operations | reject('in', valid_ops) | list | length > 0 -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' has an invalid operation. Allowed: " ~ (valid_ops | join(', ')) ~ "." -%}
    {%- elif r.operations | unique | list | length != r.operations | length -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' lists an operation more than once." -%}
    {%- elif r.endpoint in ns.eps -%}
    {%- set ns.err = "Duplicate endpoint '" ~ r.endpoint ~ "'." -%}
    {%- elif r.name in ns.names -%}
    {%- set ns.err = "Duplicate resource name '" ~ r.name ~ "'." -%}
    {%- elif r.name | lower in ns.lnames -%}
    {%- set ns.err = "Resource name '" ~ r.name ~ "' collides with another resource name when case is ignored." -%}
    {%- endif -%}
    {%- set ns.eps = ns.eps + [r.endpoint] -%}
    {%- set ns.names = ns.names + [r.name] -%}
    {%- set ns.lnames = ns.lnames + [r.name | string | lower] -%}
    {%- set ns.containers = ns.containers + [r.container | string] -%}
    {%- endif -%}
    {%- endfor -%}
    {%- for a in resources if not ns.err -%}
    {%- for b in resources if not ns.err and b.name in [a.name ~ 'Dto', a.name ~ 'List', 'Create' ~ a.name ~ 'Request', 'Update' ~ a.name ~ 'Request', 'Replace' ~ a.name ~ 'Request'] -%}
    {%- set ns.err = "Resource name '" ~ b.name ~ "' collides with an identifier generated for resource '" ~ a.name ~ "'." -%}
    {%- endfor -%}
    {%- endfor -%}
    {%- endif -%}
    {{ ns.err }}

# Git for Windows cannot check out paths containing "|", so templates read precomputed values from this copy.
path_resources:
  type: yaml
  when: false
  default: >-
    [{%- for r in resources -%}
    {{ dict(r,
    snake_name=(r.name | to_snake),
    lower_camel_name=(r.name | to_lower_camel),
    env_key=(r.container | string | upper | replace('-', '_')),
    container_class=(r.container | string | to_camel),
    has_id=(r.operations | select('in', ['get_by_id', 'update', 'replace', 'delete']) | list | length > 0),
    has_body=(r.operations | select('in', ['create', 'update', 'replace']) | list | length > 0)) | tojson }}{{ "," if not loop.last }}
    {%- endfor -%}]
