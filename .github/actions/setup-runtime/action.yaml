name: Setup Runtime
description: >-
  Set up the runtime and package manager a generated project needs, at the versions in
  runtime_versions in copier.yml.

inputs:
  language:
    required: true
    description: Template language (python, typescript, dotnet or go).
  cloud-service:
    required: true
    description: Template cloud service; Azure Functions caps the Node version.
  uv:
    required: false
    default: "false"
    description: Install uv for any language ("true"); Python projects always get it.

runs:
  using: "composite"

  steps:
    - name: Read runtime versions
      id: versions
      env:
        CLOUD: ${{ inputs.cloud-service }}
      run: python "$GITHUB_WORKSPACE/.github/scripts/runtime_versions.py"
      shell: bash

    - name: Set up Python
      if: inputs.language == 'python'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.versions.outputs.python }}

    - name: Set up uv
      if: inputs.language == 'python' || inputs.uv == 'true'
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: ${{ steps.versions.outputs.uv }}
        enable-cache: true

    - name: Set up Node
      if: inputs.language == 'typescript'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.versions.outputs.node }}.x

    - name: Enable Corepack
      if: inputs.language == 'typescript'
      run: corepack enable
      shell: bash

    - name: Set up .NET
      if: inputs.language == 'dotnet'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ steps.versions.outputs.dotnet }}.x

    - name: Set up Go
      if: inputs.language == 'go'
      uses: actions/setup-go@v7
      with:
        go-version: ${{ steps.versions.outputs.go }}
