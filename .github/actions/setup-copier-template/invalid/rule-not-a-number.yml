# expect: rule 'minimum' must be an integer
resources:
  - name: "Cat"
    endpoint: "cats"
    container: "cats"
    operations: ["list", "get_by_id", "create", "update", "delete"]
    fields:
      - {name: name, type: string, required: true}
      - {name: age, type: integer, rules: {minimum: "1"}}
