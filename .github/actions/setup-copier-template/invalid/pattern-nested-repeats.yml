# expect: nested counted repeats
resources:
  - name: "Cat"
    endpoint: "cats"
    container: "cats"
    operations: ["list", "get_by_id", "create", "update", "delete"]
    fields:
      - {name: name, type: string, required: true}
      - {name: code, type: string, example: a, rules: {pattern: '(a{10}){200}'}}
