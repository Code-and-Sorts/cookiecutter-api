# expect: example must match the pattern
resources:
  - name: "Cat"
    endpoint: "cats"
    container: "cats"
    operations: ["list", "get_by_id", "create", "update", "delete"]
    fields:
      - {name: name, type: string, required: true}
      - {name: code, type: string, example: "abc\n", rules: {pattern: '^[a-z]+$'}}
