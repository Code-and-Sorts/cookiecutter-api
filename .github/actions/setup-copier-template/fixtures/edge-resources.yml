# Every resource shape the default single resource doesn't cover, in one render:
# each operation subset (full CRUD, list-only, delete-only, update-only, replace-only,
# create-only), containers shared across resources, a hyphenated container and endpoint,
# names of differing lengths, and no health check (health_endpoint left empty).
health_endpoint: ""
resources:
  - name: "Cat"
    endpoint: "cats"
    container: "animals"
    operations: ["list", "get_by_id", "create", "update", "delete"]
  - name: "Dog"
    endpoint: "dogs"
    container: "animals"
    operations: ["list", "get_by_id", "create", "replace", "delete"]
  - name: "Hippopotamus"
    endpoint: "hippos"
    container: "zoo-records"
    operations: ["list"]
  - name: "Owl"
    endpoint: "owls"
    container: "birds"
    operations: ["delete"]
  - name: "Lynx"
    endpoint: "lynxes"
    container: "zoo-records"
    operations: ["update"]
  - name: "Puma"
    endpoint: "pumas"
    container: "zoo-records"
    operations: ["replace"]
  - name: "Order"
    endpoint: "orders"
    container: "orders"
    operations: ["list", "get_by_id", "create", "update", "replace", "delete"]
  - name: "OrderItem"
    endpoint: "order-items"
    container: "orders"
    operations: ["create"]
