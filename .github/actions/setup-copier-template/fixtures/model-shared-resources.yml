# Two resources with different models in one container: each reads the other's records through its own model.
resources:
  - name: "Cat"
    endpoint: "cats"
    container: "animals"
    operations: ["list", "get_by_id", "create", "update", "replace", "delete"]
    fields:
      - {name: name, type: string, required: true, rules: {min_length: 1}}
      - {name: lives, type: integer, default: 9, rules: {minimum: 0, maximum: 9}}
  - name: "Bird"
    endpoint: "birds"
    container: "animals"
    operations: ["list", "get_by_id", "create", "delete"]
    fields:
      - {name: name, type: string, required: true, rules: {min_length: 1}}
      - {name: wingspanCm, type: number, nullable: true, rules: {exclusive_minimum: 0}}
      - {name: canFly, type: boolean, default: true}
