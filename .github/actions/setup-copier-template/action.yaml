name: Setup Copier Template
description: Render the root Copier template for one language.

inputs:
  template-language:
    required: true
    description: Template language (python, typescript, dotnet or go), passed as the language answer.
  template-cloud-service:
    required: true
    description: Template cloud service.
  resources-fixture:
    required: false
    default: "single"
    description: >-
      "single" renders the default resource derived from the project name; any other value
      renders fixtures/<value>-resources.yml ("edge" in CI, "multi" for the example branches).
  include-infrastructure:
    required: false
    default: "false"
    description: >-
      "true" answers include_infrastructure and renders the stacks in fixtures/<cloud>-infra-environments.yml.
  output-dir:
    required: false
    default: "KittenClaws"
    description: Directory to render the generated project into.
  project-name:
    required: false
    default: "KittenClaws"
    description: Project name; Copier derives the class, slug and endpoint names from it.
  project-description:
    required: false
    default: "Kitties got claws...beware"
    description: Project description.
  project-endpoint:
    required: false
    default: ""
    description: Endpoint for the default resource; empty lets Copier derive it.
  author:
    required: false
    default: "Sir Meowsalots"
    description: Project author.
  open-source-license:
    required: false
    default: "MIT license"
    description: License choice.
  python-version:
    required: false
    default: "3.x"
    description: Python used to run Copier.

runs:
  using: "composite"

  steps:
    - name: Set up python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Copier
      run: pip install copier jinja2-strcase jinja2-time
      shell: bash

    # Inputs arrive through env, never inline, because template-setup passes issue-form text.
    - name: Create Copier Template
      env:
        LANGUAGE: ${{ inputs.template-language }}
        CLOUD: ${{ inputs.template-cloud-service }}
        FIXTURE: ${{ inputs.resources-fixture }}
        INFRASTRUCTURE: ${{ inputs.include-infrastructure }}
        OUTPUT: ${{ inputs.output-dir }}
        PROJECT_NAME: ${{ inputs.project-name }}
        PROJECT_DESCRIPTION: ${{ inputs.project-description }}
        PROJECT_ENDPOINT: ${{ inputs.project-endpoint }}
        AUTHOR: ${{ inputs.author }}
        LICENSE: ${{ inputs.open-source-license }}
      run: python "$GITHUB_WORKSPACE/.github/scripts/render_template.py"
      shell: bash

    # A static check only: running the emulators is the integration tests' job. macOS runners have no Docker.
    - name: Validate emulator files
      if: runner.os == 'Linux'
      env:
        OUTPUT: ${{ inputs.output-dir }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/validate_emulator_files.sh" "./$OUTPUT"
      shell: bash
