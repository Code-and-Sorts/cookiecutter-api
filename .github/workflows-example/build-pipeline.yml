name: Python API Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.14"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Install dependencies
        run: uv sync
        shell: bash

      - name: Run lint
        run: uv run ruff check .
        shell: bash

      - name: Run unit tests
        run: uv run pytest --cov
        shell: bash

      - name: Run dependency vulnerability scan
        continue-on-error: true
        run: uv run --with pip-audit pip-audit
        shell: bash
