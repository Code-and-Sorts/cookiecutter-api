name: Publish Example Branches

# Renders every language x cloud combination with Copier (using the `multi`
# resources fixture) and force-publishes each generated project to its own
# branch in the examples repository, so the generated output is browsable
# without running Copier locally:
#
#   https://github.com/Code-and-Sorts/cookiecutter-api-examples/tree/<cloud>-<language>
#
# for example `aws-typescript` or `azure-dotnet`. The examples repository's
# `main` branch holds only a README that links to each branch.
#
# Pushing to another repository (including each generated project's
# .github/workflows/build-pipeline.yml) needs a fine-grained Personal Access
# Token scoped to Code-and-Sorts/cookiecutter-api-examples with Contents and
# Workflows read and write, stored as the `EXAMPLES_PUBLISH_TOKEN` Actions
# secret in this repository.

on:
  push:
    branches:
      - main
    paths:
      - go/**
      - python/**
      - typescript/**
      - dotnet/**
      - copier.yml
      - shared/**
      - .github/workflows/publish-examples.yml
      - .github/actions/setup-copier-template/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-examples
  cancel-in-progress: true

env:
  EXAMPLES_REPOSITORY: Code-and-Sorts/cookiecutter-api-examples

jobs:
  publish-examples:
    # Forks have neither the secret nor push access to the examples repository.
    if: github.repository == 'Code-and-Sorts/cookiecutter-api'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - typescript
          - dotnet
          - go
        cloud:
          - name: "Azure Function App"
            slug: azure
          - name: "AWS Lambda"
            slug: aws
          - name: "GCP Cloud Function"
            slug: gcp
    steps:
      - name: Check for publish token
        env:
          HAS_TOKEN: ${{ secrets.EXAMPLES_PUBLISH_TOKEN != '' }}
        run: |
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::error::The EXAMPLES_PUBLISH_TOKEN secret is not set. Add a fine-grained PAT with Contents and Workflows read and write on ${EXAMPLES_REPOSITORY}."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v7

      - name: Render example project
        uses: ./.github/actions/setup-copier-template
        with:
          template-language: ${{ matrix.language }}
          template-cloud-service: ${{ matrix.cloud.name }}
          resources-fixture: multi
          output-dir: _example

      - name: Publish to example branch
        env:
          PUBLISH_TOKEN: ${{ secrets.EXAMPLES_PUBLISH_TOKEN }}
          BRANCH: ${{ matrix.cloud.slug }}-${{ matrix.language }}
          COMBO: "${{ matrix.language }} / ${{ matrix.cloud.name }}"
        run: |
          set -euo pipefail
          cd _example
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "${BRANCH}"
          git add -A
          git commit -q \
            -m "chore(examples): ${COMBO}" \
            -m "Generated by Copier from ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
          git push -q --force \
            "https://x-access-token:${PUBLISH_TOKEN}@github.com/${EXAMPLES_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

          echo "Published [\`${BRANCH}\`](https://github.com/${EXAMPLES_REPOSITORY}/tree/${BRANCH})" >> "$GITHUB_STEP_SUMMARY"
