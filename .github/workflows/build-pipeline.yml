name: Python Cookiecutter API Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
          # - windows-latest
        template-type:
          - name: Python
            cloud-service: "Azure Function App"
            python-version: ["3.10", "3.11"]
          - name: Typescript
            cloud-service: "Azure Function App"
            node-version: ["18.x", "20.x"]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Cookiecutter Template
        uses: ./.github/actions/setup-cookiecutter-template
        with:
          template-language: ${{ matrix.template-type.name }}
          template-cloud-service: ${{ matrix.template-type.cloud-service }}

      # - name: Set up Python environment
      #   if: ${{ matrix.template-type.name == 'Python' }}
      #   uses: ./.github/actions/setup-python
      #   with:
      #     python-version: ${{ matrix.template-type.python-version }}

      - name: Set up Typescript environment
        if: ${{ matrix.template-type.name == 'Typescript' }}
        uses: ./.github/actions/setup-typescript
        with:
          node-version: ${{ matrix.template-type.node-version }}
