name: Integration Tests

# Renders each language x cloud x resources fixture, starts the project's database emulator
# and local function host, and runs tests/integration against it over HTTP. Too slow for
# pull requests; run it on a branch with workflow_dispatch.

on:
  push:
    branches:
      - main
    paths:
      - go/**
      - python/**
      - typescript/**
      - dotnet/**
      - copier.yml
      - shared/**
      - tests/integration/**
      - .github/workflows/integration-tests.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/setup-runtime/**
      - .github/actions/start-local-api/**
  pull_request:
  workflow_dispatch:
    inputs:
      language:
        type: choice
        options: [all, python, typescript, dotnet, go]
        default: all
      cloud:
        type: choice
        options: [all, azure, gcp, aws]
        default: all
      fixture:
        type: choice
        description: all runs single and edge; multi only adds cases those two cover.
        options: [all, single, edge, multi]
        default: all
      host:
        type: choice
        description: container builds the Dockerfile of projects rendered with infrastructure (Azure for now).
        options: [local, container, all]
        default: local

permissions:
  contents: read

# Each push gets its own group so every commit to main is tested; a newer dispatch replaces an older one.
concurrency:
  group: integration-${{ github.event_name == 'push' && github.sha || github.ref }}-${{ inputs.language || 'all' }}-${{ inputs.cloud || 'all' }}-${{ inputs.fixture || 'all' }}-${{ inputs.host || 'local' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the matrix
        id: plan
        env:
          LANGUAGE: ${{ inputs.language || 'all' }}
          CLOUD: ${{ inputs.cloud || 'all' }}
          FIXTURE: ${{ inputs.fixture || 'all' }}
          HOST: ${{ inputs.host || (github.event_name == 'pull_request' && 'container' || 'local') }}
        run: python .github/scripts/integration_matrix.py

  integration:
    name: ${{ matrix.language }} / ${{ matrix.cloud.slug }} / ${{ matrix.fixture }}${{ matrix.host == 'container' && ' / container' || '' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Copier Template
        uses: ./.github/actions/setup-copier-template
        with:
          template-language: ${{ matrix.language }}
          template-cloud-service: ${{ matrix.cloud.name }}
          resources-fixture: ${{ matrix.fixture }}
          include-infrastructure: ${{ matrix.host == 'container' }}

      # uv for every language: the suite uses it too.
      - name: Setup runtime
        uses: ./.github/actions/setup-runtime
        with:
          language: ${{ matrix.language }}
          cloud-service: ${{ matrix.cloud.name }}
          uv: "true"

      - name: Install the integration suite
        run: uv sync --project tests/integration --no-dev --locked

      - name: Start the local API
        id: host
        uses: ./.github/actions/start-local-api
        with:
          language: ${{ matrix.language }}
          cloud-service: ${{ matrix.cloud.name }}
          host: ${{ matrix.host }}
          ready-timeout: ${{ matrix.host == 'container' && '900' || '300' }}

      - name: Run the integration suite
        env:
          BASE_URL: ${{ steps.host.outputs.base-url }}
        run: >-
          uv run --project tests/integration --no-dev
          pytest tests/integration --project-dir KittenClaws --base-url "$BASE_URL" --junitxml=junit.xml --record requests.jsonl

      - name: Summarize results
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        env:
          COMBO: "${{ matrix.language }} | ${{ matrix.cloud.name }} | ${{ matrix.fixture }}"
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          suite = ET.parse("junit.xml").getroot().find("testsuite")
          total, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          failed = int(suite.get("failures")) + int(suite.get("errors"))
          print("| Language | Cloud | Fixture | Passed | Failed | Skipped |")
          print("| --- | --- | --- | --- | --- | --- |")
          print(f"| {os.environ['COMBO']} | {total - failed - skipped} | {failed} | {skipped} |")
          EOF

      - name: Upload the request log
        if: ${{ !cancelled() && hashFiles('requests.jsonl') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: requests-${{ matrix.language }}-${{ matrix.cloud.slug }}-${{ matrix.fixture }}${{ matrix.host == 'container' && '-container' || '' }}
          path: requests.jsonl
          retention-days: 7

      - name: Print the request log
        if: ${{ !cancelled() && hashFiles('requests.jsonl') != '' }}
        run: |
          echo "=== REQUEST LOG BEGIN ==="
          cat requests.jsonl
          echo "=== REQUEST LOG END ==="

      - name: Collect emulator logs
        if: failure() && hashFiles('KittenClaws/docker-compose.yml') != ''
        working-directory: KittenClaws
        run: docker compose logs --no-color > emulator.log 2>&1 || true

      - name: Upload logs and the generated project
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-${{ matrix.language }}-${{ matrix.cloud.slug }}-${{ matrix.fixture }}${{ matrix.host == 'container' && '-container' || '' }}
          path: |
            junit.xml
            KittenClaws
            !KittenClaws/**/node_modules
            !KittenClaws/.venv
            !KittenClaws/**/.aws-sam
            !KittenClaws/**/bin
            !KittenClaws/**/obj
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
