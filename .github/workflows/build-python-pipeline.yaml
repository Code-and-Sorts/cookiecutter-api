name: Python Copier API Build

on:
  push:
    paths:
      - python/**
      - copier.yml
      - shared/**
      - .github/workflows/build-python-pipeline.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/setup-runtime/**
    branches:
      - main
  pull_request:
    paths:
      - python/**
      - copier.yml
      - shared/**
      - .github/workflows/build-python-pipeline.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/setup-runtime/**

jobs:
  build-python:
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows and macOS risks don't depend on the cloud, so each runs once.
      matrix:
        os:
          - ubuntu-latest
        template-type:
          - python
        cloud-service:
          - "Azure Function App"
          - "GCP Cloud Function"
          - "AWS Lambda"
        fixture:
          - single
          - edge
          - model
        include:
          - os: windows-latest
            template-type: python
            cloud-service: "Azure Function App"
            fixture: single
          - os: macos-latest
            template-type: python
            cloud-service: "AWS Lambda"
            fixture: single
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Copier Template
        uses: ./.github/actions/setup-copier-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}
          resources-fixture: ${{ matrix.fixture }}

      - name: Setup runtime
        uses: ./.github/actions/setup-runtime
        with:
          language: ${{ matrix.template-type }}
          cloud-service: ${{ matrix.cloud-service }}

      - name: Install dependencies
        run: |
          cd "KittenClaws"
          uv sync
        shell: bash

      - name: Run lint
        run: |
          cd "KittenClaws"
          uv run ruff check .
        shell: bash

      - name: Run unit tests
        run: |
            cd "KittenClaws"
            uv run pytest --cov
        shell: bash

      - name: Run Makefile targets
        if: runner.os != 'Windows'
        run: |
            cd "KittenClaws"
            make install
            make test-unit
        shell: bash

      - name: Run dependency vulnerability scan
        continue-on-error: true
        uses: ./.github/actions/dependency-audit
        with:
          command: uv run --with pip-audit pip-audit
          title: Python dependency vulnerability scan (${{ matrix.cloud-service }}, ${{ matrix.fixture }})
