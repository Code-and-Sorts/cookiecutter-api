name: Typescript Cookiecutter API Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest
          # - windows-latest
        template-type:
          - Typescript
        cloud-service:
          - "Azure Function App"
        node-version:
          - "18.x"
          - "20.x"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Cookiecutter Template
        uses: ./.github/actions/setup-cookiecutter-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}

      # - name: Set up Typescript environment
      #   uses: ./.github/actions/setup-typescript
      #   with:
      #     node-version: ${{ matrix.node-version }}

      - name: Setup Node ${{ matrix.node-version }} Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable
        shell: bash

      - name: Run install
        uses: borales/actions-yarn@v4
        with:
          cmd: install
          dir: Kitten-Claws-typescript

      - name: Run build
        uses: borales/actions-yarn@v4
        with:
          cmd: build
          dir: Kitten-Claws-typescript

      - name: Unit tests
        uses: borales/actions-yarn@v4
        with:
          cmd: test:unit
          dir: Kitten-Claws-typescript
