name: Typescript Cookiecutter API Build

on:
  push:
    paths:
      - typescript/**
      - .github/workflows/build-typescript-pipeline.yaml
      - .github/actions/setup-cookiecutter-template/**
    branches:
      - main
  pull_request:
    paths:
      - typescript/**
      - .github/workflows/build-typescript-pipeline.yaml
      - .github/actions/setup-cookiecutter-template/**
    branches:
      - main

jobs:
  build-typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        template-type:
          - typescript
        cloud-service:
          - "Azure Function App"
          - "GCP Cloud Function"
        node-version:
          - "18.x"
          - "20.x"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Setup Cookiecutter Template
        uses: ./.github/actions/setup-cookiecutter-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}

      - name: Setup Node ${{ matrix.node-version }} Environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable
        shell: bash

      - name: Run install
        run: yarn install --no-immutable
        working-directory: KittenClaws
        shell: bash

      - name: Run build
        run: yarn build
        working-directory: KittenClaws
        shell: bash

      - name: Run lint
        run: yarn lint
        working-directory: KittenClaws
        shell: bash

      - name: Unit tests
        run: yarn test:unit
        working-directory: KittenClaws
        shell: bash
