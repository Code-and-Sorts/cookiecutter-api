name: Typescript Cookiecutter API Build

on:
  push:
    paths:
      - typescript/**
    branches:
      - main
  pull_request:
    paths:
      - typescript/**
    branches:
      - main

permissions:
  contents: write

jobs:
  build-typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        template-type:
          - typescript
        cloud-service:
          - "Azure Function App"
        node-version:
          - "18.x"
          - "20.x"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Cookiecutter Template
        uses: ./.github/actions/setup-cookiecutter-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}

      - name: Setup Node ${{ matrix.node-version }} Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable
        shell: bash

      - name: Run install
        uses: borales/actions-yarn@v4
        with:
          cmd: install
          dir: KittenClaws

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain yarn.lock)" ]; then
            echo "Changes detected in yarn.lock. Committing changes."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add yarn.lock
            git commit -m "Update yarn.lock [skip ci]"
            git push
          else
            echo "No changes detected in yarn.lock."
          fi

      - name: Run build
        uses: borales/actions-yarn@v4
        with:
          cmd: build
          dir: KittenClaws

      - name: Unit tests
        uses: borales/actions-yarn@v4
        with:
          cmd: test:unit
          dir: KittenClaws
