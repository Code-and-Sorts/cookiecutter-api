name: Typescript Copier API Build

on:
  push:
    paths:
      - typescript/**
      - copier.yml
      - shared/**
      - .github/workflows/build-typescript-pipeline.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/setup-runtime/**
    branches:
      - main
  pull_request:
    paths:
      - typescript/**
      - copier.yml
      - shared/**
      - .github/workflows/build-typescript-pipeline.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/setup-runtime/**

jobs:
  build-typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows and macOS risks don't depend on the cloud, so each runs once.
      matrix:
        os:
          - ubuntu-latest
        template-type:
          - typescript
        cloud-service:
          - "Azure Function App"
          - "GCP Cloud Function"
          - "AWS Lambda"
        fixture:
          - single
          - edge
        include:
          - os: windows-latest
            template-type: typescript
            cloud-service: "Azure Function App"
            fixture: single
          - os: macos-latest
            template-type: typescript
            cloud-service: "AWS Lambda"
            fixture: single
          # With infrastructure the Azure functions are anonymous behind Entra ID and Cosmos DB is keyless.
          # Its own os label makes it a separate job: an include matching every matrix value merges into that job.
          - os: ubuntu-24.04
            template-type: typescript
            cloud-service: "Azure Function App"
            fixture: edge
            infrastructure: "true"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Copier Template
        uses: ./.github/actions/setup-copier-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}
          resources-fixture: ${{ matrix.fixture }}
          include-infrastructure: ${{ matrix.infrastructure || 'false' }}

      - name: Setup runtime
        uses: ./.github/actions/setup-runtime
        with:
          language: ${{ matrix.template-type }}
          cloud-service: ${{ matrix.cloud-service }}

      - name: Run install
        run: yarn install --no-immutable
        working-directory: KittenClaws
        shell: bash

      - name: Run build
        run: yarn build
        working-directory: KittenClaws
        shell: bash

      - name: Run lint
        run: yarn lint
        working-directory: KittenClaws
        shell: bash

      - name: Unit tests
        run: yarn test:unit
        working-directory: KittenClaws
        shell: bash

      - name: Run dependency vulnerability scan
        continue-on-error: true
        uses: ./.github/actions/dependency-audit
        with:
          command: yarn npm audit --severity moderate
          title: TypeScript dependency vulnerability scan (${{ matrix.cloud-service }}, ${{ matrix.fixture }})
