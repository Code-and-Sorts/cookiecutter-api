name: Typescript Copier API Build

on:
  push:
    paths:
      - typescript/**
      - .github/workflows/build-typescript-pipeline.yaml
      - .github/actions/setup-copier-template/**
    branches:
      - main
  pull_request:
    paths:
      - typescript/**
      - .github/workflows/build-typescript-pipeline.yaml
      - .github/actions/setup-copier-template/**
    branches:
      - main

jobs:
  build-typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        template-type:
          - typescript
        cloud-service:
          - "Azure Function App"
          - "GCP Cloud Function"
          - "AWS Lambda"
        node-version:
          - "20.x"
          - "22.x"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Setup Copier Template
        uses: ./.github/actions/setup-copier-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}

      - name: Setup Node ${{ matrix.node-version }} Environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable
        shell: bash

      - name: Run install
        run: yarn install --no-immutable
        working-directory: KittenClaws
        shell: bash

      - name: Run build
        run: yarn build
        working-directory: KittenClaws
        shell: bash

      - name: Run lint
        run: yarn lint
        working-directory: KittenClaws
        shell: bash

      - name: Unit tests
        run: yarn test:unit
        working-directory: KittenClaws
        shell: bash

      - name: Run dependency vulnerability scan
        continue-on-error: true
        run: |
            set +e
            yarn npm audit --severity moderate 2>&1 | tee audit.log
            status=$?
            set -e
            {
              echo "### TypeScript dependency vulnerability scan (${{ matrix.cloud-service }})"
              echo ""
              echo '```'
              cat audit.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
        working-directory: KittenClaws
        shell: bash
