name: Template Setup

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-project:
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.issue.labels.*.name, 'template-setup')
      && github.event.issue.title == 'Template Setup'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Parse issue form
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;

            function getField(label) {
              const regex = new RegExp(`### ${label}\\s*\\n\\s*(.+?)\\s*(?:\\n###|$)`, 's');
              const match = body.match(regex);
              const value = match ? match[1].trim() : '';
              // Normalize GitHub's placeholder for blank optional fields
              if (!value || value === '_No response_') return '';
              return value;
            }

            function validateSafeField(label, value) {
              const safePattern = /^(?!-)[A-Za-z0-9 ._-]+$/;
              if (!value) {
                core.setFailed(`Missing required field: "${label}"`);
                return null;
              }
              if (
                value.includes('..') ||
                value.includes('/') ||
                value.includes('\\') ||
                /[\r\n\t]/.test(value) ||
                !safePattern.test(value)
              ) {
                core.setFailed(
                  `Invalid ${label}: only letters, numbers, spaces, dots, underscores, and hyphens are allowed.`
                );
                return null;
              }
              return value;
            }

            function validateProjectName(label, value) {
              const projectNamePattern = /^[A-Za-z][A-Za-z0-9 ]*$/;
              if (!value) {
                core.setFailed(`Missing required field: "${label}"`);
                return null;
              }
              if (!projectNamePattern.test(value)) {
                core.setFailed(
                  `Invalid ${label}: use letters, numbers, and spaces only, and start with a letter.`
                );
                return null;
              }
              return value;
            }

            function validateEndpoint(value) {
              if (!value) return '';
              const endpointPattern = /^[a-z][a-z0-9-]*$/;
              if (!endpointPattern.test(value)) {
                core.setFailed(
                  'Invalid Endpoint Name: use lowercase letters, numbers, and hyphens only, and start with a letter.'
                );
                return null;
              }
              return value;
            }

            const language = getField('Language');
            const cloudService = validateSafeField('Cloud Service', getField('Cloud Service'));
            const projectName = validateProjectName('Project Name', getField('Project Name'));
            const projectDescription = getField('Project Description') || 'This is a template repository for API projects.';
            const endpointInput = validateEndpoint(getField('Endpoint Name'));
            const author = getField('Author') || 'Template User';
            const license = validateSafeField('Open Source License', getField('Open Source License'));

            if (endpointInput === null || !cloudService || !projectName || !license) {
              return;
            }

            // Map language display name to template directory
            const languageMap = {
              'TypeScript': 'typescript',
              'C#': 'dotnet',
              'Go': 'go',
              'Python': 'python',
            };
            const templateDir = languageMap[language];

            if (!templateDir) {
              core.setFailed(`Invalid language selection: "${language}"`);
              return;
            }

            // Use provided endpoint or derive from project name
            const projectEndpoint = endpointInput
              ? endpointInput
              : projectName.toLowerCase().replace(/\s+/g, '-');

            // CamelCase: capitalize first letter of each word, remove spaces
            const projectClassName = projectName
              .split(/\s+/)
              .map(w => w.charAt(0).toUpperCase() + w.slice(1))
              .join('');

            // lowerCamelCase: same as CamelCase but first letter lowercase
            const projectLowerCamelName = projectClassName.charAt(0).toLowerCase() + projectClassName.slice(1);

            // Python slug: lowercase, spaces to underscores
            const projectSlug = projectName.toLowerCase().replace(/\s+/g, '_');

            core.setOutput('language', language);
            core.setOutput('template_dir', templateDir);
            core.setOutput('cloud_service', cloudService);
            core.setOutput('project_name', projectName);
            core.setOutput('project_description', projectDescription);
            core.setOutput('project_endpoint', projectEndpoint);
            core.setOutput('project_class_name', projectClassName);
            core.setOutput('project_lower_camel_name', projectLowerCamelName);
            core.setOutput('project_slug', projectSlug);
            core.setOutput('author', author);
            core.setOutput('license', license);

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install cookiecutter
        run: pip install cookiecutter jinja2-strcase

      - name: Run cookiecutter
        env:
          TEMPLATE_DIR: ${{ steps.parse.outputs.template_dir }}
          PROJECT_NAME: ${{ steps.parse.outputs.project_name }}
          PROJECT_DESCRIPTION: ${{ steps.parse.outputs.project_description }}
          PROJECT_ENDPOINT: ${{ steps.parse.outputs.project_endpoint }}
          PROJECT_CLASS_NAME: ${{ steps.parse.outputs.project_class_name }}
          PROJECT_LOWER_CAMEL_NAME: ${{ steps.parse.outputs.project_lower_camel_name }}
          PROJECT_SLUG: ${{ steps.parse.outputs.project_slug }}
          AUTHOR: ${{ steps.parse.outputs.author }}
          CLOUD_SERVICE: ${{ steps.parse.outputs.cloud_service }}
          LICENSE: ${{ steps.parse.outputs.license }}
        run: |
          cookiecutter ./"$TEMPLATE_DIR" --no-input \
            project_name="$PROJECT_NAME" \
            project_description="$PROJECT_DESCRIPTION" \
            project_slug="$PROJECT_SLUG" \
            project_endpoint="$PROJECT_ENDPOINT" \
            project_lower_camel_name="$PROJECT_LOWER_CAMEL_NAME" \
            project_class_name="$PROJECT_CLASS_NAME" \
            author="$AUTHOR" \
            cloud_service="$CLOUD_SERVICE" \
            open_source_license="$LICENSE"

      - name: Replace repo contents with generated project
        env:
          PROJECT_CLASS_NAME: ${{ steps.parse.outputs.project_class_name }}
        run: |
          if [[ -z "$PROJECT_CLASS_NAME" ]]; then
            echo "PROJECT_CLASS_NAME is empty, aborting." >&2
            exit 1
          fi

          if [[ ! -d "$PROJECT_CLASS_NAME" ]]; then
            echo "Expected generated project directory '$PROJECT_CLASS_NAME' was not found." >&2
            exit 1
          fi

          # Remove everything except .git and the generated project directory
          find . -maxdepth 1 \
            ! -name '.' \
            ! -name '.git' \
            ! -name "$PROJECT_CLASS_NAME" \
            -exec rm -rf {} +

          # Copy generated project files to repo root (including hidden files),
          # then remove the generated project directory.
          cp -a -- "$PROJECT_CLASS_NAME"/. .
          rm -rf -- "$PROJECT_CLASS_NAME"

      - name: Create pull request
        uses: actions/github-script@v7
        env:
          LANGUAGE: ${{ steps.parse.outputs.language }}
          CLOUD_SERVICE: ${{ steps.parse.outputs.cloud_service }}
          PROJECT_NAME: ${{ steps.parse.outputs.project_name }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const issueNumber = context.payload.issue.number;
            const branch = `setup/initial-project-${issueNumber}`;

            // Configure git
            execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
            execFileSync('git', ['config', 'user.email', 'github-actions[bot]@users.noreply.github.com']);

            // Create branch, stage, commit, push
            execFileSync('git', ['checkout', '-b', branch]);
            execFileSync('git', ['add', '-A']);
            execFileSync('git', ['commit', '-m', `chore: generate ${process.env.LANGUAGE} ${process.env.CLOUD_SERVICE} project from template`]);
            execFileSync('git', ['push', '-u', 'origin', branch]);

            // Create the pull request
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Setup: ${process.env.PROJECT_NAME} (${process.env.LANGUAGE} / ${process.env.CLOUD_SERVICE})`,
              head: branch,
              base: 'main',
              body: [
                `## Project Setup`,
                '',
                `Generated from the cookiecutter template based on #${issueNumber}.`,
                '',
                `| Setting | Value |`,
                `|---------|-------|`,
                `| **Language** | ${process.env.LANGUAGE} |`,
                `| **Cloud Service** | ${process.env.CLOUD_SERVICE} |`,
                `| **Project Name** | ${process.env.PROJECT_NAME} |`,
                '',
                `### What this PR does`,
                `- Generates the project from the cookiecutter template`,
                `- Includes only the **${process.env.LANGUAGE}** build and test workflow`,
                `- Removes all template scaffolding (cookiecutter dirs, setup workflows, issue templates)`,
                '',
                `Closes #${issueNumber}`,
              ].join('\n'),
            });

            // Comment on the issue and close it
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Your project has been generated!\n\nA pull request has been created: #${pr.data.number}\n\nMerge it to complete the setup.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });
