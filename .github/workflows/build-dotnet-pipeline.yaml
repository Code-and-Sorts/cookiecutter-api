name: Dotnet Cookiecutter API Build

on:
  push:
    paths:
      - dotnet/**
      - .github/workflows/build-dotnet-pipeline.yaml
      - .github/actions/setup-cookiecutter-template/**
    branches:
      - main
  pull_request:
    paths:
      - dotnet/**
      - .github/workflows/build-dotnet-pipeline.yaml
      - .github/actions/setup-cookiecutter-template/**
    branches:
      - main

jobs:
  build-dotnet:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        template-type:
          - dotnet
        cloud-service:
          - "Azure Function App"
          - "GCP Cloud Function"
          - "AWS Lambda"
        dotnet-version:
          - "8.x"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Setup Cookiecutter Template
        uses: ./.github/actions/setup-cookiecutter-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}

      - name: Setup dotnet ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install dependencies
        run: make install
        working-directory: KittenClaws

      - name: Build
        run: make build
        working-directory: KittenClaws

      - name: Run lint
        run: make lint
        working-directory: KittenClaws

      - name: Test with the dotnet CLI
        run: make test-unit
        working-directory: KittenClaws

      - name: Run dependency vulnerability scan
        continue-on-error: true
        run: |
            set +e
            make audit 2>&1 | tee audit.log
            status=$?
            set -e
            {
              echo "### .NET dependency vulnerability scan (${{ matrix.cloud-service }})"
              echo ""
              echo '```'
              cat audit.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
        working-directory: KittenClaws
        shell: bash
