name: Dotnet Copier API Build

on:
  push:
    paths:
      - dotnet/**
      - .github/workflows/build-dotnet-pipeline.yaml
      - .github/actions/setup-copier-template/**
    branches:
      - main
  pull_request:
    paths:
      - dotnet/**
      - .github/workflows/build-dotnet-pipeline.yaml
      - .github/actions/setup-copier-template/**

jobs:
  build-dotnet:
    runs-on: ${{ matrix.os }}
    strategy:
      # Ubuntu covers every cloud with the default single resource and the edge fixture, which
      # holds every other resource shape. Windows (path length, checkout) and macOS (BSD tools)
      # risks don't depend on the cloud, so each runs once, on a different cloud.
      matrix:
        os:
          - ubuntu-latest
        template-type:
          - dotnet
        cloud-service:
          - "Azure Function App"
          - "GCP Cloud Function"
          - "AWS Lambda"
        dotnet-version:
          - "10.x"
        fixture:
          - single
          - edge
        include:
          - os: windows-latest
            template-type: dotnet
            cloud-service: "Azure Function App"
            dotnet-version: "10.x"
            fixture: single
          - os: macos-latest
            template-type: dotnet
            cloud-service: "AWS Lambda"
            dotnet-version: "10.x"
            fixture: single
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Copier Template
        uses: ./.github/actions/setup-copier-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}
          resources-fixture: ${{ matrix.fixture }}

      - name: Setup dotnet ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install dependencies
        run: make install
        working-directory: KittenClaws

      - name: Build
        run: make build
        working-directory: KittenClaws

      - name: Run lint
        run: make lint
        working-directory: KittenClaws

      - name: Test with the dotnet CLI
        run: make test-unit
        working-directory: KittenClaws

      - name: Run dependency vulnerability scan
        continue-on-error: true
        run: |
            set +e
            make audit 2>&1 | tee audit.log
            status=$?
            set -e
            {
              echo "### .NET dependency vulnerability scan (${{ matrix.cloud-service }}, ${{ matrix.fixture }} resources)"
              echo ""
              echo '```'
              cat audit.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
        working-directory: KittenClaws
        shell: bash
