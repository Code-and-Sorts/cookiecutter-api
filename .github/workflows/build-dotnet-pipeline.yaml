name: Dotnet Cookiecutter API Build

on:
  push:
    paths:
      - dotnet/**
    branches:
      - main
  pull_request:
    paths:
      - dotnet/**
    branches:
      - main

jobs:
  build-dotnet:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        template-type:
          - dotnet
        cloud-service:
          - "Azure Function App"
        dotnet-version:
          - "8.x"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Cookiecutter Template
        uses: ./.github/actions/setup-cookiecutter-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}

      - name: Setup dotnet ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install dependencies
        run: make install
        working-directory: KittenClaws

      - name: Build
        run: make build
        working-directory: KittenClaws

      - name: Test with the dotnet CLI
        run: make test-unit
        working-directory: KittenClaws
