name: Dotnet Copier API Build

on:
  push:
    paths:
      - dotnet/**
      - copier.yml
      - shared/**
      - .github/workflows/build-dotnet-pipeline.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/setup-runtime/**
    branches:
      - main
  pull_request:
    paths:
      - dotnet/**
      - copier.yml
      - shared/**
      - .github/workflows/build-dotnet-pipeline.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/setup-runtime/**

jobs:
  build-dotnet:
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows and macOS risks don't depend on the cloud, so each runs once.
      matrix:
        os:
          - ubuntu-latest
        template-type:
          - dotnet
        cloud-service:
          - "Azure Function App"
          - "GCP Cloud Function"
          - "AWS Lambda"
        fixture:
          - single
          - edge
        include:
          - os: windows-latest
            template-type: dotnet
            cloud-service: "Azure Function App"
            fixture: single
          - os: macos-latest
            template-type: dotnet
            cloud-service: "AWS Lambda"
            fixture: single
          - os: ubuntu-24.04
            template-type: dotnet
            cloud-service: "Azure Function App"
            fixture: edge
            infrastructure: "true"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Copier Template
        uses: ./.github/actions/setup-copier-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}
          resources-fixture: ${{ matrix.fixture }}
          include-infrastructure: ${{ matrix.infrastructure || 'false' }}

      - name: Setup runtime
        uses: ./.github/actions/setup-runtime
        with:
          language: ${{ matrix.template-type }}
          cloud-service: ${{ matrix.cloud-service }}

      - name: Install dependencies
        run: make install
        working-directory: KittenClaws

      - name: Build
        run: make build
        working-directory: KittenClaws

      - name: Run lint
        run: make lint
        working-directory: KittenClaws

      - name: Test with the dotnet CLI
        run: make test-unit
        working-directory: KittenClaws

      - name: Run dependency vulnerability scan
        continue-on-error: true
        uses: ./.github/actions/dependency-audit
        with:
          command: make audit
          title: .NET dependency vulnerability scan (${{ matrix.cloud-service }}, ${{ matrix.fixture }})
