name: OpenAPI Consistency

# Every language must render the same openapi.json for the same answers.
on:
  push:
    paths:
      - python/**
      - typescript/**
      - dotnet/**
      - go/**
      - .github/workflows/openapi-consistency.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/lint-openapi/**
    branches:
      - main
  pull_request:
    paths:
      - python/**
      - typescript/**
      - dotnet/**
      - go/**
      - .github/workflows/openapi-consistency.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/lint-openapi/**

jobs:
  openapi-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Copier
        run: pip install copier jinja2-strcase jinja2-time

      # Copier cannot share files between templates, so each language keeps its own copy.
      - name: Check the spec templates are identical
        run: |
          for language in typescript dotnet go; do
            cmp python/_openapi.yaml.jinja "$language/_openapi.yaml.jinja"
          done
          for spec in typescript/template/openapi.json go/template/openapi.json "dotnet/template/{{project_class_name}}.Api/openapi.json"; do
            cmp python/template/openapi.json "$spec"
          done

      - name: Render every language, cloud and fixture
        run: |
          fixtures=.github/actions/setup-copier-template/fixtures
          for language in python typescript dotnet go; do
            for cloud in "azure:Azure Function App" "gcp:GCP Cloud Function" "aws:AWS Lambda"; do
              for fixture in single multi edge; do
                args=()
                if [ "$fixture" != single ]; then
                  args+=(--data-file "$fixtures/$fixture-resources.yml")
                fi
                copier copy --quiet --defaults --trust \
                  --data project_name=KittenClaws \
                  --data cloud_service="${cloud#*:}" \
                  "${args[@]}" "./$language" "rendered/$language/${cloud%%:*}/$fixture"
              done
            done
          done

      # Within a cloud the documents must match exactly; across clouds only servers and security may differ.
      - name: Compare the rendered specs
        run: |
          python - rendered <<'EOF'
          import difflib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])


          def load(project):
              (path,) = project.rglob("openapi.json")
              return json.loads(path.read_text(encoding="utf-8"))


          def cloud_neutral(doc):
              doc = json.loads(json.dumps(doc))
              del doc["servers"], doc["security"], doc["components"]["securitySchemes"]
              for item in doc["paths"].values():
                  for operation in item.values():
                      if isinstance(operation, dict):
                          operation.pop("security", None)
              return doc


          def lines(doc):
              return json.dumps(doc, indent=2, sort_keys=True).splitlines()


          specs = {project.relative_to(root).parts: load(project) for project in sorted(root.glob("*/*/*"))}
          failed = False
          for key, spec in specs.items():
              language, cloud, fixture = key
              for reference, normalize in (
                  (("python", cloud, fixture), lambda doc: doc),
                  (("python", "azure", fixture), cloud_neutral),
              ):
                  expected, actual = normalize(specs[reference]), normalize(spec)
                  if expected != actual:
                      failed = True
                      print(f"::error::{'/'.join(key)} differs from {'/'.join(reference)}")
                      print("\n".join(difflib.unified_diff(lines(expected), lines(actual), "/".join(reference), "/".join(key), lineterm="")))
          print(f"Compared {len(specs)} rendered specs.")
          sys.exit(1 if failed else 0)
          EOF

      # The previous step proved every language renders the same document, so one language covers them all.
      - name: Lint every cloud and fixture
        uses: ./.github/actions/lint-openapi
        with:
          specs: >-
            rendered/python/azure/single/openapi.json
            rendered/python/azure/multi/openapi.json
            rendered/python/azure/edge/openapi.json
            rendered/python/gcp/single/openapi.json
            rendered/python/gcp/multi/openapi.json
            rendered/python/gcp/edge/openapi.json
            rendered/python/aws/single/openapi.json
            rendered/python/aws/multi/openapi.json
            rendered/python/aws/edge/openapi.json
