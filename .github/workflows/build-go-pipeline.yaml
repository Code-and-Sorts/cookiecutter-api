name: Go Cookiecutter API Build

on:
  push:
    paths:
      - go/**
      - .github/workflows/build-go-pipeline.yaml
      - .github/actions/setup-cookiecutter-template/**
    branches:
      - main
  pull_request:
    paths:
      - go/**
      - .github/workflows/build-go-pipeline.yaml
      - .github/actions/setup-cookiecutter-template/**
    branches:
      - main

jobs:
  build-go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        template-type:
          - go
        cloud-service:
          - "Azure Function App"
          - "GCP Cloud Function"
          - "AWS Lambda"
        go-version:
          - "1.22"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Setup Cookiecutter Template
        uses: ./.github/actions/setup-cookiecutter-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install dependencies
        run: make install
        working-directory: KittenClaws

      - name: Build
        run: make build
        working-directory: KittenClaws

      - name: Run lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: KittenClaws

      - name: Test with the Go CLI
        run: make test-unit
        working-directory: KittenClaws

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run dependency vulnerability scan
        continue-on-error: true
        run: |
            set +e
            govulncheck ./... 2>&1 | tee audit.log
            status=$?
            set -e
            {
              echo "### Go dependency vulnerability scan (${{ matrix.cloud-service }})"
              echo ""
              echo '```'
              cat audit.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
        working-directory: KittenClaws
        shell: bash
