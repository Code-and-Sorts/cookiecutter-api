name: Go Copier API Build

on:
  push:
    paths:
      - go/**
      - copier.yml
      - shared/**
      - .github/workflows/build-go-pipeline.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/setup-runtime/**
    branches:
      - main
  pull_request:
    paths:
      - go/**
      - copier.yml
      - shared/**
      - .github/workflows/build-go-pipeline.yaml
      - .github/actions/setup-copier-template/**
      - .github/actions/setup-runtime/**

jobs:
  build-go:
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows and macOS risks don't depend on the cloud, so each runs once.
      matrix:
        os:
          - ubuntu-latest
        template-type:
          - go
        cloud-service:
          - "Azure Function App"
          - "GCP Cloud Function"
          - "AWS Lambda"
        fixture:
          - single
          - edge
        include:
          - os: windows-latest
            template-type: go
            cloud-service: "Azure Function App"
            fixture: single
          - os: macos-latest
            template-type: go
            cloud-service: "AWS Lambda"
            fixture: single
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Copier Template
        uses: ./.github/actions/setup-copier-template
        with:
          template-language: ${{ matrix.template-type }}
          template-cloud-service: ${{ matrix.cloud-service }}
          resources-fixture: ${{ matrix.fixture }}

      - name: Setup runtime
        uses: ./.github/actions/setup-runtime
        with:
          language: ${{ matrix.template-type }}
          cloud-service: ${{ matrix.cloud-service }}

      - name: Install dependencies
        run: make install
        working-directory: KittenClaws

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: KittenClaws
        shell: bash

      - name: Vet
        run: go vet ./...
        working-directory: KittenClaws

      - name: Build
        run: make build
        working-directory: KittenClaws

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: KittenClaws

      - name: Test with the Go CLI
        run: make test-unit
        working-directory: KittenClaws

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run dependency vulnerability scan
        continue-on-error: true
        uses: ./.github/actions/dependency-audit
        with:
          command: govulncheck ./...
          title: Go dependency vulnerability scan (${{ matrix.cloud-service }}, ${{ matrix.fixture }})
