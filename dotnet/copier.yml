_jinja_extensions:
  - jinja2_strcase.StrcaseExtension
  - jinja2_time.TimeExtension

# Render every file as a template (Cookiecutter-style) instead of requiring a
# .jinja suffix on each file.
_templates_suffix: ""

# The template content lives in template/; its contents are rendered directly
# into the destination directory.
_subdirectory: template

project_name:
  type: str
  default: "Cookiecutter API"
  # Validation runs against the values derived from the project name. Copier
  # only evaluates validators for prompted questions, so the checks that
  # Cookiecutter's pre_gen hook ran on the derived names live here.
  validator: >-
    {%- set project_lower_camel_name = project_name | to_lower_camel -%}
    {%- set project_class_name = project_name | to_camel -%}
    {%- set project_endpoint = project_name.lower().replace(' ', '-') -%}
    {%- if not (project_lower_camel_name | regex_search('^[a-z]+(?:[A-Z][a-z]+)*$')) -%}
    The project lower camel {{ project_lower_camel_name }} is not valid camel case. Please create a name using camelCase.
    {%- elif not (project_class_name | regex_search('^[A-Z][a-zA-Z0-9]*$')) -%}
    The project class name {{ project_class_name }} is not a valid class name. Please create a class name using PascalCase.
    {%- elif not (project_endpoint | regex_search('^[a-zA-Z0-9\-_]*$')) -%}
    The project endpoint {{ project_endpoint }} is not a valid REST endpoint name. Please do not use a space or _ and use - instead.
    {%- endif -%}

project_description:
  type: str
  default: "This is a template repository for API projects."

author:
  type: str
  default: "Code and Sorts (Colby Timm)"

cloud_service:
  type: str
  default: "Azure Function App"
  choices:
    - "Azure Function App"
    - "GCP Cloud Function"
    - "AWS Lambda"

open_source_license:
  type: str
  default: "MIT license"
  choices:
    - "MIT license"
    - "BSD license"
    - "ISC license"
    - "Apache Software License 2.0"
    - "GNU General Public License v3"
    - "Not open source"

# ---- Derived values (never prompted) ----
project_lower_camel_name:
  type: str
  when: false
  default: "{{ project_name | to_lower_camel }}"

project_endpoint:
  type: str
  when: false
  default: "{{ project_name.lower().replace(' ', '-') }}"

project_class_name:
  type: str
  when: false
  default: "{{ project_name | to_camel }}"

# ---- REST resources ----
# A list of resources to generate. Each resource gets its own URL endpoint, a
# storage container (resources sharing a container id share storage), and a
# chosen subset of operations. The default is a single resource matching the
# project name with today's CRUD behaviour, so answering only project_name
# reproduces the original single-resource project.
resources:
  type: yaml
  multiline: true
  help: >-
    Resources to generate. Each item: name (PascalCase), endpoint (kebab-case URL
    segment), container (storage id; equal ids share storage), operations (subset of
    list, get_by_id, create, update, replace, delete).
  default: |
    - name: "{{ project_class_name }}"
      endpoint: "{{ project_endpoint }}"
      container: "{{ project_endpoint }}"
      operations: ["list", "get_by_id", "create", "update", "delete"]
  validator: >-
    {%- set valid_ops = ["list", "get_by_id", "create", "update", "replace", "delete"] -%}
    {%- set reserved_names = ["Health", "BaseEntity", "Mocks", "System", "Newtonsoft",
      "Action", "Activator", "ApplicationException", "Arg", "Array", "Assert", "Attribute",
      "Buffer", "CancellationToken", "Console", "Convert", "DateTime", "Delegate", "Enum",
      "Enumerable", "Environment", "Exception", "GC", "Guid", "Half", "Index", "Int128",
      "Interlocked", "KeyValuePair", "Lock", "Math", "Monitor", "Mutex", "Nullable", "Object",
      "Parallel", "Queryable", "Random", "Range", "Record", "Semaphore", "String", "Substitute",
      "Task", "TestContext", "Thread", "TimeProvider", "Timeout", "Timer", "Tuple", "Type", "Uri",
      "ValueTask", "Version", "Volatile"] -%}
    {%- if cloud_service == "Azure Function App" -%}
    {%- set reserved_names = reserved_names + ["Container", "Database", "PartitionKey", "User"] -%}
    {%- elif cloud_service == "GCP Cloud Function" -%}
    {%- set reserved_names = reserved_names + ["Google"] -%}
    {%- endif -%}
    {%- set ns = namespace(err="", eps=[], names=[], containers=[]) -%}
    {%- if resources | length < 1 -%}
    {%- set ns.err = "At least one resource is required." -%}
    {%- elif cloud_service == "AWS Lambda" and 2 * (project_class_name | length) + 59 > 127 -%}
    {%- set ns.err = "Project name '" ~ project_name ~ "' is too long for AWS Lambda: the health handler string would exceed the 127-character limit." -%}
    {%- else -%}
    {%- for r in resources -%}
    {%- if not ns.err -%}
    {%- set name_key = r.name | string | lower -%}
    {%- if not r.name or not (r.name | string | regex_search('^[A-Z][A-Za-z0-9]*$')) -%}
    {%- set ns.err = "Resource name '" ~ (r.name | default('')) ~ "' must be PascalCase." -%}
    {%- elif r.name in reserved_names -%}
    {%- set ns.err = "Resource name '" ~ r.name ~ "' is reserved: it collides with a type or namespace the generated " ~ cloud_service ~ " project already uses. Choose another name." -%}
    {%- elif not r.endpoint or not (r.endpoint | string | regex_search('^[a-z0-9][a-z0-9\-]*$')) -%}
    {%- set ns.err = "Resource endpoint '" ~ (r.endpoint | default('')) ~ "' must be a kebab-case URL segment." -%}
    {%- elif r.endpoint == "health" -%}
    {%- set ns.err = "Resource endpoint 'health' is reserved for the health check." -%}
    {%- elif not r.container or not (r.container | string | regex_search('^[A-Za-z0-9_\-]+$')) -%}
    {%- set ns.err = "Resource container '" ~ (r.container | default('')) ~ "' has an invalid id." -%}
    {%- elif (r.operations | default([]) | length) < 1 -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' must enable at least one operation." -%}
    {%- elif r.operations | reject('in', valid_ops) | list | length > 0 -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' has an invalid operation. Allowed: " ~ (valid_ops | join(', ')) ~ "." -%}
    {%- elif (r.operations | unique | list | length) != (r.operations | length) -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' lists an operation more than once." -%}
    {%- elif r.endpoint in ns.eps -%}
    {%- set ns.err = "Duplicate endpoint '" ~ r.endpoint ~ "'." -%}
    {%- elif name_key in ns.names -%}
    {%- set ns.err = "Duplicate resource name '" ~ r.name ~ "' (names must differ ignoring case)." -%}
    {%- elif (name_key ~ "list") in ns.names or (name_key.endswith("list") and name_key[:-4] in ns.names) -%}
    {%- set ns.err = "Resource name '" ~ r.name ~ "' collides with the generated list function of another resource." -%}
    {%- endif -%}
    {%- if not ns.err -%}
    {%- set container = r.container | string -%}
    {%- for other in ns.containers if other != container and ((other | upper | replace('-', '_')) == (container | upper | replace('-', '_')) or (other | to_camel) == (container | to_camel)) -%}
    {%- set ns.err = "Containers '" ~ other ~ "' and '" ~ container ~ "' map to the same setting and resource names; use the same id to share storage or clearly different ids." -%}
    {%- endfor -%}
    {%- endif -%}
    {%- if not ns.err and cloud_service == "AWS Lambda" -%}
    {%- set method_prefix_length = {"list": 7, "get_by_id": 3, "create": 6, "update": 6, "replace": 7, "delete": 6} -%}
    {%- for op in r.operations if 2 * (project_class_name | length) + 47 + 2 * (method_prefix_length[op] + (r.name | length)) > 127 -%}
    {%- set ns.err = "Resource name '" ~ r.name ~ "' is too long for project '" ~ project_class_name ~ "': its AWS Lambda handler strings would exceed the 127-character limit. Shorten the resource or project name." -%}
    {%- endfor -%}
    {%- endif -%}
    {%- set ns.eps = ns.eps + [r.endpoint] -%}
    {%- set ns.names = ns.names + [name_key] -%}
    {%- set ns.containers = ns.containers + [r.container | string] -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
    {{ ns.err }}
