[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
azure-cosmos = "^4.17.1"
boto3 = "^1.43.107"
httpx = "^0.28.1"
pytest = "^9.1.1"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.9"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
    "ops(*operations): run once per resource that enables every listed operation",
    "each_operation(*operations): run once per resource and listed operation it enables",
]

[tool.ruff]
line-length = 120
