services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20260907
    ports:
      - "8081:8081" # gateway
      - "1234:1234" # Data Explorer
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 60s

networks:
  default:
    name: kittenclaws-emulator
