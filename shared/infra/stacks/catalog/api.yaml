{%- set containers = path_resources | unique(attribute='container') | list -%}
# The API component; each stack in deploy/ adds its region and tiers.
components:
  terraform:
    api:
      vars:
        name: {{ project_endpoint | replace('_', '-') }}
        compute:
{%- if cloud_service == 'Azure Function App' %}
{%- if language == 'python' %}
          runtime:
            name: python
            version: "3.14"
          # ${database_endpoint} and ${database_name} are filled in by Terraform.
          app_settings:
            Cosmos_Db_Uri: "${database_endpoint}"
            Cosmos_Db_Database_Name: "${database_name}"
{%- for c in containers %}
            Container_Name_{{ c.container_key }}: "{{ c.container }}"
{%- endfor %}
{%- elif language == 'typescript' %}
          runtime:
            name: node
            version: "22"
          # ${database_endpoint} and ${database_name} are filled in by Terraform.
          app_settings:
            COSMOS_DB_URL: "${database_endpoint}"
            COSMOS_DB_DATABASE_NAME: "${database_name}"
{%- for c in containers %}
            COSMOS_CONTAINER_{{ c.env_key }}: "{{ c.container }}"
{%- endfor %}
{%- elif language == 'go' %}
          runtime:
            name: custom
            version: "1.0"
          # ${database_endpoint} and ${database_name} are filled in by Terraform.
          app_settings:
            CosmosDbEndpoint: "${database_endpoint}"
            CosmosDbDatabaseName: "${database_name}"
{%- for c in containers %}
            CosmosDbContainerName_{{ c.container_class }}: "{{ c.container }}"
{%- endfor %}
{%- else %}
          runtime:
            name: dotnet-isolated
            version: "10.0"
          # ${database_endpoint} and ${database_name} are filled in by Terraform.
          app_settings:
            ConnectionStrings__CosmosDb: "AccountEndpoint=${database_endpoint};"
            CosmosDbDatabaseName: "${database_name}"
{%- for c in containers %}
            CosmosDbContainerName_{{ c.container_class }}: "{{ c.container }}"
{%- endfor %}
{%- endif %}
{%- endif %}
        database:
          containers:
{%- for c in containers %}
            - "{{ c.container }}"
{%- endfor %}
        gateway:
          publisher_name: {{ author | tojson }}
          publisher_email: {{ infra_admin_email | tojson }}
          health_endpoint: "{{ health_endpoint }}"
          routes:
{%- for r in resources %}
            - name: {{ r.name }}
              endpoint: {{ r.endpoint }}
              operations: [{{ r.operations | join(', ') }}]
{%- endfor %}
