{% raw %}name: Python API Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.13"
          - "3.14"
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        env:
          POETRY_VERSION: "1.8.3"
        run: curl -sSL https://install.python-poetry.org | python - -y
        shell: bash

      - name: Add Poetry to Path (Linux and macOS)
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Add Poetry to Path (Windows)
        if: runner.os == 'Windows'
        run: echo "$HOME\AppData\Roaming\Python\Scripts" >> $GITHUB_PATH
        shell: bash

      - name: Configure Poetry virtual environment in project
        run: poetry config virtualenvs.in-project true
        shell: bash

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction
        shell: bash

      - name: Run lint
        run: poetry run ruff check .
        shell: bash

      - name: Run unit tests
        run: poetry run pytest --cov
        shell: bash

      - name: Run dependency vulnerability scan
        continue-on-error: true
        run: |
          poetry run pip install pip-audit
          poetry run pip-audit
        shell: bash
{% endraw %}