[project]
name = "{{ project_slug }}"
version = "0.1.0"
description = "{{ project_description }}"
authors = [{ name = "{{ author }}" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
{%- if cloud_service == 'Azure Function App' %}
    "azure-functions==2.3.0",
    "azure-cosmos>=4.17.1,<5",
    "azure-identity>=1.26.0,<2",
    # The async Cosmos DB client (azure.cosmos.aio) needs aiohttp, which azure-cosmos does not install.
    "aiohttp>=3.14.3,<4",
{%- endif %}
{%- if cloud_service == 'GCP Cloud Function' %}
    "google-cloud-firestore>=2.33.0,<3",
    "functions-framework>=3.10.2,<4",
{%- endif %}
{%- if cloud_service == 'AWS Lambda' %}
    "aioboto3>=15.5.0,<16",
{%- endif %}
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-describe>=3.2.0,<4",
    "ruff>=0.16.9,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["*_test.py", "conftest.py"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".aws-sam"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "W293"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"
