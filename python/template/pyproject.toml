[tool.poetry]
name = "{{ project_name }}"
version = "0.1.0"
description = "{{ project_description }}"
authors = ["{{ author }}"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
{%- if cloud_service == 'Azure Function App' %}
azure-functions = "2.3.0"
azure-cosmos = "^4.17.1"
# The async Cosmos DB client (azure.cosmos.aio) needs aiohttp, which azure-cosmos does not install.
aiohttp = "^3.14.3"
{%- endif %}
{%- if cloud_service == 'GCP Cloud Function' %}
google-cloud-firestore = "^2.33.0"
functions-framework = "^3.10.2"
{%- endif %}
{%- if cloud_service == 'AWS Lambda' %}
aioboto3 = "^15.5.0"
{%- endif %}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-describe = "^3.2.0"
ruff = "^0.16.9"

# Needed by `poetry export` in {% if cloud_service == 'AWS Lambda' %}`sam build`{% else %}`make requirements`{% endif %}.
[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.9"

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["*_test.py", "conftest.py"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".poetry", ".aws-sam"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "W293"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
