# Per-resource paths use the `yield` tag, which needs this Copier version.
_min_copier_version: "9.18.2"

_jinja_extensions:
  - jinja2_strcase.StrcaseExtension
  - jinja2_time.TimeExtension

# Render every file as a template, not only *.jinja files.
_templates_suffix: ""

_subdirectory: template

project_name:
  type: str
  default: "Cookiecutter API"
  # Copier skips validators on derived (when: false) values, so the derived names are checked here.
  validator: >-
    {%- set project_lower_camel_name = project_name | to_lower_camel -%}
    {%- set project_class_name = project_name | to_camel -%}
    {%- set project_endpoint = project_name.lower().replace(' ', '-') -%}
    {%- if not (project_lower_camel_name | regex_search('^[a-z]+(?:[A-Z][a-z]+)*$')) -%}
    The project lower camel {{ project_lower_camel_name }} is not valid camel case. Please create a name using camelCase.
    {%- elif not (project_class_name | regex_search('^[A-Z][A-Za-z0-9]*$')) -%}
    The project class name {{ project_class_name }} is not a valid class name. Please create a class name using PascalCase.
    {%- elif not (project_endpoint | regex_search('^[a-zA-Z0-9\-_]*$')) -%}
    The project endpoint {{ project_endpoint }} is not a valid REST endpoint name. Please do not use a space or _ and use - instead.
    {%- endif -%}

project_description:
  type: str
  default: "This is a template repository for API projects."

author:
  type: str
  default: "Code and Sorts (Colby Timm)"

cloud_service:
  type: str
  default: "Azure Function App"
  choices:
    - "Azure Function App"
    - "GCP Cloud Function"
    - "AWS Lambda"

open_source_license:
  type: str
  default: "MIT license"
  choices:
    - "MIT license"
    - "BSD license"
    - "ISC license"
    - "Apache Software License 2.0"
    - "GNU General Public License v3"
    - "Not open source"

project_lower_camel_name:
  type: str
  when: false
  default: "{{ project_name | to_lower_camel }}"

project_endpoint:
  type: str
  when: false
  default: "{{ project_name.lower().replace(' ', '-') }}"

project_class_name:
  type: str
  when: false
  default: "{{ project_name | to_camel }}"

# Empty on the other clouds so Copier skips the directory; keeps paths short for Git for Windows.
functions_dir:
  type: str
  when: false
  default: "{{ 'functions' if cloud_service == 'Azure Function App' else '' }}"

routes_dir:
  type: str
  when: false
  default: "{{ 'routes' if cloud_service != 'Azure Function App' else '' }}"

health_endpoint:
  type: str
  default: "health"
  help: URL segment for the health check; leave empty to generate no health check.
  validator: >-
    {%- if health_endpoint and not (health_endpoint | regex_search('^[a-z0-9][a-z0-9\-]*$')) -%}
    Health endpoint '{{ health_endpoint }}' must be a kebab-case URL segment, or empty to skip the health check.
    {%- endif -%}

resources:
  type: yaml
  multiline: true
  help: >-
    Resources to generate. Each item: name (PascalCase), endpoint (kebab-case URL
    segment), container (storage id; equal ids share storage), operations (subset of
    list, get_by_id, create, update, replace, delete).
  default: |
    - name: "{{ project_class_name }}"
      endpoint: "{{ project_endpoint }}"
      container: "{{ project_endpoint }}"
      operations: ["list", "get_by_id", "create", "update", "delete"]
  validator: >-
    {%- set valid_ops = ["list", "get_by_id", "create", "update", "replace", "delete"] -%}
    {%- set reserved_names = ["Base", "BaseEnv", "BaseIdentifier", "BaseItem", "Env", "Guid", "Partial", "Promise", "SchemaValidator", "ValidationError"] -%}
    {%- if cloud_service == "Azure Function App" -%}
    {%- set reserved_names = reserved_names + ["HttpRequest", "HttpResponseInit", "InvocationContext"] -%}
    {%- elif cloud_service == "AWS Lambda" -%}
    {%- set reserved_names = reserved_names + ["APIGatewayProxyEvent", "APIGatewayProxyResult"] -%}
    {%- endif -%}
    {%- set generated_suffixes = ["Controller", "Entity", "EntitySchema", "Record", "Repository", "Request", "RequestSchema", "Response", "ResponseSchema", "Schema", "Service", "Update", "UpdateSchema"] -%}
    {%- set ns = namespace(err="", eps=[], names=[], raw_names=[], containers={}, clash="") -%}
    {%- if resources | length < 1 -%}
    {%- set ns.err = "At least one resource is required." -%}
    {%- else -%}
    {%- for r in resources -%}
    {%- if not ns.err -%}
    {%- set ops = r.operations | default([]) -%}
    {%- set container_key = r.container | default('') | string | lower | replace('-', '_') -%}
    {%- set name = r.name | default('') | string -%}
    {%- set ns.clash = "" -%}
    {%- for p in ns.raw_names -%}
    {%- if (name.startswith(p) and name[p | length:] in generated_suffixes) or (p.startswith(name) and p[name | length:] in generated_suffixes) -%}
    {%- set ns.clash = p -%}
    {%- endif -%}
    {%- endfor -%}
    {%- if not r.name or not (r.name | string | regex_search('^[A-Z][A-Za-z0-9]*$')) -%}
    {%- set ns.err = "Resource name '" ~ (r.name | default('')) ~ "' must be PascalCase." -%}
    {%- elif r.name == "Health" -%}
    {%- set ns.err = "Resource name 'Health' is reserved." -%}
    {%- elif r.name in reserved_names -%}
    {%- set ns.err = "Resource name '" ~ r.name ~ "' is reserved because it collides with a generated or imported TypeScript identifier or a shared file name. Reserved names: " ~ (reserved_names | join(', ')) ~ "." -%}
    {%- elif not r.endpoint or not (r.endpoint | string | regex_search('^[a-z0-9][a-z0-9\-]*$')) -%}
    {%- set ns.err = "Resource endpoint '" ~ (r.endpoint | default('')) ~ "' must be a kebab-case URL segment." -%}
    {%- elif health_endpoint and r.endpoint == health_endpoint -%}
    {%- set ns.err = "Resource endpoint '" ~ r.endpoint ~ "' is reserved for the health check." -%}
    {%- elif not r.container or not (r.container | string | regex_search('^[A-Za-z0-9_\-]+$')) -%}
    {%- set ns.err = "Resource container '" ~ (r.container | default('')) ~ "' has an invalid id." -%}
    {%- elif (ops | length) < 1 -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' must enable at least one operation." -%}
    {%- elif ops | reject('in', valid_ops) | list | length > 0 -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' has an invalid operation. Allowed: " ~ (valid_ops | join(', ')) ~ "." -%}
    {%- elif (ops | unique | list | length) != (ops | length) -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' lists an operation more than once." -%}
    {%- elif r.endpoint in ns.eps -%}
    {%- set ns.err = "Duplicate endpoint '" ~ r.endpoint ~ "'." -%}
    {%- elif (r.name | lower) in ns.names -%}
    {%- set ns.err = "Resource name '" ~ r.name ~ "' collides with another resource name (names must differ case-insensitively)." -%}
    {%- elif ns.clash -%}
    {%- set ns.err = "Resource names '" ~ ns.clash ~ "' and '" ~ r.name ~ "' collide: one is the other plus a generated suffix (" ~ (generated_suffixes | join(', ')) ~ ")." -%}
    {%- elif container_key in ns.containers and ns.containers[container_key] != r.container -%}
    {%- set ns.err = "Container '" ~ r.container ~ "' collides with container '" ~ ns.containers[container_key] ~ "' (ids must differ after lowercasing and replacing '-' with '_'); use the same id to share storage." -%}
    {%- endif -%}
    {%- set ns.eps = ns.eps + [r.endpoint] -%}
    {%- set ns.names = ns.names + [r.name | string | lower] -%}
    {%- set ns.raw_names = ns.raw_names + [name] -%}
    {%- if container_key not in ns.containers -%}
    {%- set ns.containers = dict(ns.containers, **{container_key: r.container}) -%}
    {%- endif -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
    {{ ns.err }}

# Git for Windows can't check out paths containing "|", so per-resource paths yield from
# this copy, which precomputes the filtered file-name stems.
path_resources:
  type: yaml
  when: false
  default: >-
    [{%- for r in resources -%}
    {{ dict(r, snake_name=(r.name | to_snake), lower_camel_name=(r.name | to_lower_camel)) | tojson }}{{ "," if not loop.last }}
    {%- endfor -%}]
