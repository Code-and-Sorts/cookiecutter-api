# `yield` in file paths needs Copier 9.18.2+.
_min_copier_version: "9.18.2"

_jinja_extensions:
  - jinja2_strcase.StrcaseExtension
  - jinja2_time.TimeExtension

# Render every file as a template, not only *.jinja files.
_templates_suffix: ""

# Only the chosen language's tree is rendered; its files include shared/ from the repository root.
_subdirectory: "{{ language }}/template"

language:
  type: str
  help: Language of the generated project.
  choices:
    Python: python
    TypeScript: typescript
    .NET (C#): dotnet
    Go: go

project_name:
  type: str
  default: "Cookiecutter API"
  # Copier skips validators on derived (when: false) values, so they are checked here.
  validator: >-
    {%- set project_slug = project_name.lower().replace(' ', '_') -%}
    {%- set project_lower_camel_name = project_name | to_lower_camel -%}
    {%- set project_class_name = project_name | to_camel -%}
    {%- set project_endpoint = project_name.lower().replace(' ', '-') -%}
    {%- if language == 'python' and not (project_slug | regex_search('^[_a-zA-Z][_a-zA-Z0-9]+$')) -%}
    The project slug {{ project_slug }} is not a valid Python module name. Please do not use a - and use _ instead.
    {%- elif language != 'python' and not (project_lower_camel_name | regex_search('^[a-z]+(?:[A-Z][a-z]+)*$')) -%}
    The project lower camel {{ project_lower_camel_name }} is not valid camel case. Please create a name using camelCase.
    {%- elif not (project_class_name | regex_search('^[A-Z][A-Za-z0-9]*$')) -%}
    The project class name {{ project_class_name }} is not a valid class name. Please create a class name using PascalCase.
    {%- elif not (project_endpoint | regex_search('^[a-zA-Z0-9\-_]*$')) -%}
    The project endpoint {{ project_endpoint }} is not a valid REST endpoint name. Please do not use a space or _ and use - instead.
    {%- endif -%}

project_description:
  type: str
  default: "This is a template repository for API projects."

author:
  type: str
  default: "Code and Sorts (Colby Timm)"

cloud_service:
  type: str
  default: "Azure Function App"
  choices:
    - "Azure Function App"
    - "GCP Cloud Function"
    - "AWS Lambda"

open_source_license:
  type: str
  default: "MIT license"
  choices:
    - "MIT license"
    - "BSD license"
    - "ISC license"
    - "Apache Software License 2.0"
    - "GNU General Public License v3"
    - "Not open source"

project_slug:
  type: str
  when: false
  default: "{{ project_name.lower().replace(' ', '_') }}"

project_lower_camel_name:
  type: str
  when: false
  default: "{{ project_name | to_lower_camel }}"

project_endpoint:
  type: str
  when: false
  default: "{{ project_name.lower().replace(' ', '-') }}"

project_class_name:
  type: str
  when: false
  default: "{{ project_name | to_camel }}"

# Empty where unused so Copier skips the path; short names stay under Git for Windows' 260-character limit.
functions_dir:
  type: str
  when: false
  default: "{{ 'functions' if language == 'typescript' and cloud_service == 'Azure Function App' else '' }}"

routes_dir:
  type: str
  when: false
  default: "{{ 'routes' if language == 'typescript' and cloud_service != 'Azure Function App' else '' }}"

azure_dir:
  type: str
  when: false
  default: "{{ 'Functions' if language == 'dotnet' and cloud_service == 'Azure Function App' else '' }}"

gcp_dir:
  type: str
  when: false
  default: "{{ 'Handlers' if language == 'dotnet' and cloud_service == 'GCP Cloud Function' else '' }}"

aws_dir:
  type: str
  when: false
  default: "{{ 'Functions' if language == 'dotnet' and cloud_service == 'AWS Lambda' else '' }}"

health_endpoint:
  type: str
  default: "health"
  help: URL segment for the health check (kebab-case); leave empty to generate no health check.
  validator: >-
    {%- if health_endpoint and not (health_endpoint | regex_search('^[a-z0-9][a-z0-9\-]*$')) -%}
    Health endpoint '{{ health_endpoint }}' must be a kebab-case URL segment, or empty to generate no health check.
    {%- endif -%}

base_model:
  type: yaml
  multiline: true
  help: >-
    Fields every resource stores, on top of its own fields. The six pre-populated fields are built in and
    locked (only description may change): the server sets them, they are never accepted in a request body,
    and only id is returned. createdBy and updatedBy come from the X-User-Id header ($user) and are stored
    only when it is sent. Add your own fields after them, for example {name: tenantId, type: string,
    required: true}; they use the same keys as resource fields (see resources).
  default: |
    - {name: id, type: uuid, required: true, managed: create, default: $uuid}
    - {name: isDeleted, type: boolean, required: true, managed: create, default: false, hidden: true}
    - {name: createdTimestamp, type: date-time, required: true, managed: create, default: $now, hidden: true}
    - {name: updatedTimestamp, type: date-time, required: true, managed: write, default: $now, hidden: true}
    - {name: createdBy, type: string, managed: create, default: $user, hidden: true}
    - {name: updatedBy, type: string, managed: write, default: $user, hidden: true}
  validator: >-
    {%- from 'shared/_fields.jinja' import LOCKED_FIELDS, LOCKED_YAML, check_field -%}
    {%- set ns = namespace(err="", names=[]) -%}
    {%- if base_model is string or base_model is mapping or base_model is not iterable -%}
    {%- set ns.err = "base_model must be a list of fields." -%}
    {%- endif -%}
    {%- for f in base_model if not ns.err -%}
    {%- set name = f.name if f is mapping and f.name is string else "" -%}
    {%- if name in LOCKED_FIELDS -%}
    {%- set view = {"type": f.type | default(none), "required": f.required | default(false), "nullable": f.nullable | default(false), "immutable": f.immutable | default(false), "hidden": f.hidden | default(false), "managed": f.managed | default(""), "default": f.default | default(none)} -%}
    {%- if view != LOCKED_FIELDS[name] or (f | reject("in", ["name", "type", "required", "nullable", "immutable", "hidden", "managed", "default", "description"]) | list) -%}
    {%- set ns.err = "base_model field '" ~ name ~ "' is built in: only its description may change. Write it as " ~ LOCKED_YAML[name] ~ "." -%}
    {%- endif -%}
    {%- else -%}
    {%- set ns.err = check_field(f, "base_model") | trim -%}
    {%- endif -%}
    {%- if not ns.err and (name | lower) in (ns.names | map("lower") | list) -%}
    {%- set ns.err = "base_model field '" ~ name ~ "' is listed more than once (names must differ ignoring case)." -%}
    {%- endif -%}
    {%- set ns.names = ns.names + [name] -%}
    {%- endfor -%}
    {%- for name in LOCKED_FIELDS if not ns.err and name not in ns.names -%}
    {%- set ns.err = "base_model must keep the built-in field '" ~ name ~ "': " ~ LOCKED_YAML[name] ~ "." -%}
    {%- endfor -%}
    {{ ns.err }}

resources:
  type: yaml
  multiline: true
  help: >-
    Resources to generate. Each item: name (PascalCase), endpoint (kebab-case URL
    segment), container (storage id; equal ids share storage), operations (subset of
    list, get_by_id, create, update, replace, delete), fields and optional requests. The
    health_endpoint segment, the name Health and some names per language are reserved.
    fields lists the resource's own fields (default: one required, non-empty string name);
    each has name (lowerCamelCase), type (string, integer, number, boolean, date-time,
    date, uuid, enum with values, array with items), and optionally required, nullable,
    immutable (accepted on create only), hidden (stored, never returned), default (a value,
    null, $now, $today or $uuid; $$ escapes a literal $), rules (min_length, max_length,
    pattern, format email|uri; minimum, maximum, exclusive_minimum, exclusive_maximum;
    min_items, max_items, unique_items), example and description. requests.create,
    requests.replace and requests.update optionally narrow the fields each body accepts.
  default: |
    - name: "{{ project_class_name }}"
      endpoint: "{{ project_endpoint }}"
      container: "{{ project_slug if language == 'python' else project_endpoint }}"
      operations: ["list", "get_by_id", "create", "update", "delete"]
      fields:
        - {name: name, type: string, required: true, rules: {min_length: 1}}
  # Only reserve a name after watching the generated project fail to build with it.
  validator: >-
    {%- from 'shared/_fields.jinja' import DEFAULT_FIELDS, check_field -%}
    {%- set valid_ops = ["list", "get_by_id", "create", "update", "replace", "delete"] -%}
    {%- set resource_keys = ["name", "endpoint", "container", "operations", "fields", "requests", "base"] -%}
    {%- set base_names = base_model | map(attribute="name") | map("lower") | list -%}
    {%- set generated_suffixes = [] -%}
    {%- if language == "python" -%}
    {%- set reserved_names = ["Base", "Repository", "Health", "List", "Optional", "BaseModel", "Model", "Field", "UUID", "Request", "Database", "Attr", "ClientError", "ContainerProxy", "CosmosAccessConditionFailedError", "AsyncCollectionReference", "NotFoundError", "ValidationError", "AsyncMock", "MagicMock", "ValueError", "TypeError", "StopIteration", "StopAsyncIteration"] -%}
    {%- set python_keywords = ["and", "as", "assert", "async", "await", "break", "class", "continue", "def", "del", "elif", "else", "except", "finally", "for", "from", "global", "if", "import", "in", "is", "lambda", "nonlocal", "not", "or", "pass", "raise", "return", "try", "while", "with", "yield"] -%}
    {%- set generated_suffixes = ["Controller", "CreateRequest", "Entity", "ReplaceRequest", "Repository", "Response", "Service", "UpdateRequest"] -%}
    {%- elif language == "typescript" -%}
    {%- set reserved_names = ["Health", "Base", "BaseEnv", "BaseIdentifier", "BaseItem", "Env", "Guid", "Partial", "Promise", "SchemaValidator", "ValidationError"] + {"Azure Function App": ["HttpRequest", "HttpResponseInit", "InvocationContext"], "AWS Lambda": ["APIGatewayProxyEvent", "APIGatewayProxyResult"]}.get(cloud_service, []) -%}
    {%- set generated_suffixes = ["Controller", "CreateRequest", "CreateRequestSchema", "EntitySchema", "Record", "ReplaceRequest", "ReplaceRequestSchema", "Repository", "Response", "ResponseSchema", "Service", "UpdateRequest", "UpdateRequestSchema"] -%}
    {%- elif language == "dotnet" -%}
    {%- set reserved_names = ["Health", "Base"] + {"AWS Lambda": ["Type", "HashCode"], "GCP Cloud Function": ["IResource"]}.get(cloud_service, []) -%}
    {%- else -%}
    {%- set reserved_names = ["Health", "BaseEntity", "BaseCreateRequest", "BaseReplaceRequest", "BaseUpdateRequest", "BaseResponse", "BaseError", "DateTime", "NotFoundError", "Now", "Today", "ValidationError"] -%}
    {%- endif -%}
    {%- set ns = namespace(err="", eps=[], names=[], containers=[], idents={}, own=[], clash="", ident="", name_clash="", fnames=[]) -%}
    {%- if resources | length < 1 -%}
    {%- set ns.err = "At least one resource is required." -%}
    {%- elif language == "dotnet" and health_endpoint and cloud_service == "AWS Lambda" and 2 * (project_class_name | length) + 61 > 127 -%}
    {%- set ns.err = "Project name '" ~ project_name ~ "' is too long for AWS Lambda: the health handler string would exceed the 127-character limit." -%}
    {%- endif -%}
    {%- for r in resources -%}
    {%- if not ns.err -%}
    {%- set name = r.name | default('') | string -%}
    {%- set name_key = name | lower -%}
    {%- set lnames = ns.names | map('lower') | list -%}
    {%- set container = r.container | default('') | string -%}
    {#- Python and TypeScript compare ids as written, so YAML 1 and "1" are different ids. -#}
    {%- set container_id = r.container if language in ["python", "typescript"] else container -%}
    {%- set ns.clash = "" -%}
    {%- for other in ns.containers if other != container_id and ((other | string | upper | replace('-', '_')) == (container | upper | replace('-', '_')) or (language in ["dotnet", "go"] and (other | string | to_camel) == (container | to_camel))) -%}
    {%- set ns.clash = other -%}
    {%- endfor -%}
    {%- set ns.own = [] -%}
    {%- for s in generated_suffixes -%}{%- set ns.own = ns.own + [name ~ s] -%}{%- endfor -%}
    {%- set ns.ident = "" -%}
    {%- for i in ns.own if language == "python" and not ns.ident and i in ns.idents -%}
    {%- set ns.ident = i -%}
    {%- endfor -%}
    {%- set ns.name_clash = "" -%}
    {%- for p in ns.names -%}
    {%- if language == "typescript" and ((name.startswith(p) and name[p | length:] in generated_suffixes) or (p.startswith(name) and p[name | length:] in generated_suffixes)) -%}
    {%- set ns.name_clash = p -%}
    {%- elif language == "go" and (name in [p ~ "Dto", p ~ "List", "Create" ~ p ~ "Request", "Update" ~ p ~ "Request", "Replace" ~ p ~ "Request"] or p in [name ~ "Dto", name ~ "List", "Create" ~ name ~ "Request", "Update" ~ name ~ "Request", "Replace" ~ name ~ "Request"]) -%}
    {%- set ns.name_clash = p -%}
    {%- elif language == "dotnet" and (p | lower in [name_key ~ "list", "i" ~ name_key] or name_key in [(p | lower) ~ "list", "i" ~ (p | lower)]) -%}
    {%- set ns.name_clash = p -%}
    {%- endif -%}
    {%- endfor -%}
    {%- if not r.name or not (r.name | string | regex_search('^[A-Z][A-Za-z0-9]*$')) -%}
    {%- set ns.err = "Resource name '" ~ (r.name | default('')) ~ "' must be PascalCase." -%}
    {%- elif r.name in reserved_names -%}
    {%- set ns.err = "Resource name '" ~ r.name ~ "' is reserved: it collides with a name the generated " ~ cloud_service ~ " project already uses. Reserved names: " ~ (reserved_names | join(', ')) ~ "." -%}
    {%- elif language == "python" and (r.name | to_snake) in python_keywords -%}
    {%- set ns.err = "Resource name '" ~ r.name ~ "' would generate the module name '" ~ (r.name | to_snake) ~ "', which is a Python keyword." -%}
    {%- elif not r.endpoint or not (r.endpoint | string | regex_search('^[a-z0-9][a-z0-9\-]*$')) -%}
    {%- set ns.err = "Resource endpoint '" ~ (r.endpoint | default('')) ~ "' must be a kebab-case URL segment." -%}
    {%- elif health_endpoint and r.endpoint == health_endpoint -%}
    {%- set ns.err = "Resource endpoint '" ~ r.endpoint ~ "' is reserved for the health check." -%}
    {%- elif not r.container or not (r.container | string | regex_search('^[A-Za-z0-9_\-]+$')) -%}
    {%- set ns.err = "Resource container '" ~ (r.container | default('')) ~ "' has an invalid id." -%}
    {%- elif (r.operations | default([]) | length) < 1 -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' must enable at least one operation." -%}
    {%- elif r.operations | reject('in', valid_ops) | list | length > 0 -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' has an invalid operation. Allowed: " ~ (valid_ops | join(', ')) ~ "." -%}
    {%- elif (r.operations | unique | list | length) != (r.operations | length) -%}
    {%- set ns.err = "Resource '" ~ r.name ~ "' lists an operation more than once." -%}
    {%- elif r.endpoint in ns.eps -%}
    {%- set ns.err = "Duplicate endpoint '" ~ r.endpoint ~ "'." -%}
    {%- elif name_key in lnames -%}
    {%- set ns.err = "Duplicate resource name '" ~ r.name ~ "' (names must differ ignoring case)." -%}
    {%- elif ns.clash -%}
    {%- set ns.err = "Containers '" ~ ns.clash ~ "' and '" ~ container ~ "' map to the same setting or resource name; use the same id to share storage or clearly different ids." -%}
    {%- elif ns.ident and ns.idents[ns.ident] != r.name -%}
    {%- set ns.err = "Resource names '" ~ ns.idents[ns.ident] ~ "' and '" ~ r.name ~ "' both generate the Python name '" ~ ns.ident ~ "' (generated names add the prefix Base or a suffix: " ~ (generated_suffixes | join(', ')) ~ "). Rename one of them." -%}
    {%- elif ns.name_clash -%}
    {%- set ns.err = "Resource names '" ~ ns.name_clash ~ "' and '" ~ r.name ~ "' collide: one is the other plus a prefix or suffix the generated code adds. Rename one of them." -%}
    {%- endif -%}
    {%- if not ns.err -%}
    {%- set fields = r.fields if r.fields is defined else DEFAULT_FIELDS -%}
    {%- set requests = r.requests if r.requests is defined else {} -%}
    {%- set ns.fnames = [] -%}
    {%- set type_names = [name ~ "Entity", name ~ "Dto", name ~ "Response", name ~ "CreateRequest", name ~ "ReplaceRequest", name ~ "UpdateRequest", "Create" ~ name ~ "Request", "Replace" ~ name ~ "Request", "Update" ~ name ~ "Request"] -%}
    {%- for key in r if not ns.err and key not in resource_keys -%}
    {%- set ns.err = "Resource '" ~ name ~ "' has an unknown key '" ~ key ~ "'. Allowed: " ~ (resource_keys | join(', ')) ~ "." -%}
    {%- endfor -%}
    {%- if ns.err -%}
    {%- elif r.base is defined and r.base is not sameas true -%}
    {%- set ns.err = "Resource '" ~ name ~ "': base: false (opting out of base_model) is not supported yet; every resource extends base_model." -%}
    {%- elif fields is string or fields is mapping or fields is not iterable -%}
    {%- set ns.err = "Resource '" ~ name ~ "': fields must be a list of fields." -%}
    {%- endif -%}
    {%- for f in fields if not ns.err -%}
    {%- set ns.err = check_field(f, "Resource '" ~ name ~ "'") | trim -%}
    {%- if ns.err -%}
    {%- elif (f.name | lower) in (ns.fnames | map("lower") | list) -%}
    {%- set ns.err = "Resource '" ~ name ~ "' field '" ~ f.name ~ "' is listed more than once (names must differ ignoring case)." -%}
    {%- elif (f.name | lower) in base_names -%}
    {%- set ns.err = "Resource '" ~ name ~ "' field '" ~ f.name ~ "' is already a base_model field." -%}
    {%- elif (f.name | to_camel) in type_names -%}
    {%- set ns.err = "Resource '" ~ name ~ "' field '" ~ f.name ~ "' would generate the member " ~ (f.name | to_camel) ~ ", which is also a generated type name for the resource; rename the field." -%}
    {%- endif -%}
    {%- set ns.fnames = ns.fnames + [f.name] -%}
    {%- endfor -%}
    {%- if ns.err -%}
    {%- elif requests is not mapping -%}
    {%- set ns.err = "Resource '" ~ name ~ "': requests must map create, replace or update to a list of field names." -%}
    {%- else -%}
    {%- for op in requests if not ns.err -%}
    {%- set listed = requests[op] -%}
    {%- if op not in ["create", "replace", "update"] -%}
    {%- set ns.err = "Resource '" ~ name ~ "': requests." ~ op ~ " is not a request body; use create, replace or update." -%}
    {%- elif op not in r.operations -%}
    {%- set ns.err = "Resource '" ~ name ~ "': requests." ~ op ~ " is set but the resource does not enable " ~ op ~ "." -%}
    {%- elif listed is string or listed is mapping or listed is not iterable -%}
    {%- set ns.err = "Resource '" ~ name ~ "': requests." ~ op ~ " must be a list of field names." -%}
    {%- elif (listed | unique(case_sensitive=true) | list | length) != (listed | length) -%}
    {%- set ns.err = "Resource '" ~ name ~ "': requests." ~ op ~ " lists a field more than once." -%}
    {%- else -%}
    {%- for field_name in listed if not ns.err -%}
    {%- set field = fields | selectattr("name", "equalto", field_name) | first -%}
    {%- if field is not defined -%}
    {%- set ns.err = "Resource '" ~ name ~ "': requests." ~ op ~ " names '" ~ field_name ~ "', which is not one of its fields (base_model fields are always accepted)." -%}
    {%- elif op != "create" and field.immutable | default(false) -%}
    {%- set ns.err = "Resource '" ~ name ~ "': requests." ~ op ~ " names '" ~ field_name ~ "', which is immutable (accepted on create only)." -%}
    {%- endif -%}
    {%- endfor -%}
    {%- endif -%}
    {%- endfor -%}
    {%- for f in fields if not ns.err and "create" in requests and f.required | default(false) and "default" not in f and f.name not in requests["create"] -%}
    {%- set ns.err = "Resource '" ~ name ~ "': requests.create must list '" ~ f.name ~ "', which is required and has no default." -%}
    {%- endfor -%}
    {%- endif -%}
    {%- endif -%}
    {%- if not ns.err and language == "dotnet" and cloud_service == "AWS Lambda" -%}
    {%- set method_prefix_length = {"list": 7, "get_by_id": 3, "create": 6, "update": 6, "replace": 7, "delete": 6} -%}
    {%- for op in r.operations if 2 * (project_class_name | length) + 43 + (r.name | length) + 2 * (method_prefix_length[op] + (r.name | length)) > 127 -%}
    {%- set ns.err = "Resource name '" ~ r.name ~ "' is too long for project '" ~ project_class_name ~ "': its AWS Lambda handler strings would exceed the 127-character limit. Shorten the resource or project name." -%}
    {%- endfor -%}
    {%- endif -%}
    {%- set ns.eps = ns.eps + [r.endpoint] -%}
    {%- set ns.names = ns.names + [name] -%}
    {%- set ns.containers = ns.containers + [container_id] -%}
    {%- for i in ns.own if language == "python" and i not in ns.idents -%}
    {%- set ns.idents = dict(ns.idents, **{i: r.name}) -%}
    {%- endfor -%}
    {%- endif -%}
    {%- endfor -%}
    {{ ns.err }}

# Normalized base_model fields (defaults filled in, system flags, samples) for templates; see shared/_fields.jinja.
base_fields:
  type: yaml
  when: false
  default: >-
    {%- from 'shared/_fields.jinja' import base_fields_json -%}
    {{ base_fields_json(base_model) }}

# Git for Windows can't check out paths containing "|", so paths yield from this copy, which precomputes filtered names.
# fields holds each resource's normalized fields (the default when an older answers file has none).
path_resources:
  type: yaml
  when: false
  default: >-
    {%- from 'shared/_fields.jinja' import resource_fields_json -%}
    [{%- for r in resources -%}
    {%- set ops = r.operations -%}
    {%- set container_key = r.container | string | replace('-', '_') -%}
    {{ dict(r,
    fields=(resource_fields_json(r) | from_json),
    snake_name=(r.name | to_snake),
    lower_camel_name=(r.name | to_lower_camel),
    container_key=container_key,
    env_key=(container_key | upper),
    container_class=(r.container | string | to_camel),
    has_body=("create" in ops or "update" in ops or "replace" in ops),
    has_collection=("list" in ops or "create" in ops),
    has_item=("get_by_id" in ops or "update" in ops or "replace" in ops or "delete" in ops),
    has_dto=(ops | reject("equalto", "delete") | list | length > 0)) | tojson }}{{ "," if not loop.last }}
    {%- endfor -%}]

# .NET request and validation model paths loop over this to stay under Git for Windows' 260-character limit.
body_resources:
  type: yaml
  when: false
  default: >-
    [{%- for r in path_resources if r.has_body -%}
    {{ r | tojson }}{{ "," if not loop.last }}
    {%- endfor -%}]
