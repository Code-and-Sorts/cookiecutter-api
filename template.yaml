AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kitties got claws...beware

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs24.x

Resources:
  KittenClawsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/lambda.handler
      CodeUri: .
      Description: Kitties got claws...beware
      Architectures:
        - x86_64
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME_ANIMALS: !Ref AnimalsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnimalsTable
      Events:
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: get
        ListCat:
          Type: Api
          Properties:
            Path: /cats
            Method: get
        GetCat:
          Type: Api
          Properties:
            Path: /cats/{id}
            Method: get
        CreateCat:
          Type: Api
          Properties:
            Path: /cats
            Method: post
        UpdateCat:
          Type: Api
          Properties:
            Path: /cats/{id}
            Method: patch
        DeleteCat:
          Type: Api
          Properties:
            Path: /cats/{id}
            Method: delete
        ListDog:
          Type: Api
          Properties:
            Path: /dogs
            Method: get
        GetDog:
          Type: Api
          Properties:
            Path: /dogs/{id}
            Method: get
        CreateDog:
          Type: Api
          Properties:
            Path: /dogs
            Method: post
        ReplaceDog:
          Type: Api
          Properties:
            Path: /dogs/{id}
            Method: put
        DeleteDog:
          Type: Api
          Properties:
            Path: /dogs/{id}
            Method: delete

  AnimalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: animals
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

Outputs:
  KittenClawsApi:
    Description: API Gateway endpoint base URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  KittenClawsFunction:
    Description: Lambda Function ARN
    Value: !GetAtt KittenClawsFunction.Arn
