AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kitties got claws...beware

Metadata:
  cfn-lint:
    config:
      # SAM's generated usage plan repeats a DependsOn that its Ref already implies.
      ignore_checks:
        - W3005

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs24.x
  Api:
    Auth:
      ApiKeyRequired: true
      UsagePlan:
        CreateUsagePlan: PER_API

Resources:
  KittenClawsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/lambda.handler
      CodeUri: .
      Description: Kitties got claws...beware
      Architectures:
        - x86_64
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME_KITTENCLAWS: !Ref KittenclawsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KittenclawsTable
      Events:
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: get
            Auth:
              ApiKeyRequired: false
        ListKittenClaws:
          Type: Api
          Properties:
            Path: /kittenclaws
            Method: get
        GetKittenClaws:
          Type: Api
          Properties:
            Path: /kittenclaws/{id}
            Method: get
        CreateKittenClaws:
          Type: Api
          Properties:
            Path: /kittenclaws
            Method: post
        UpdateKittenClaws:
          Type: Api
          Properties:
            Path: /kittenclaws/{id}
            Method: patch
        DeleteKittenClaws:
          Type: Api
          Properties:
            Path: /kittenclaws/{id}
            Method: delete

  KittenclawsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: kittenclaws
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

Outputs:
  KittenClawsApi:
    Description: API Gateway endpoint base URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  KittenClawsApiKeyId:
    Description: API key id; read its value with aws apigateway get-api-key --api-key <id> --include-value --query value --output text
    Value: !Ref ServerlessRestApiApiKey
  KittenClawsFunction:
    Description: Lambda Function ARN
    Value: !GetAtt KittenClawsFunction.Arn
